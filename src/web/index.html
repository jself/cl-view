<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#111214">
<title>cl</title>
<link rel="stylesheet" href="/xterm.css">
<style>
  :root { --bg: #111; --bar: #1c1c1c; --key: #2a2a2a; --key-down: #3a3a3a; --fg: #e5e5e5; --muted: #999; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); overflow: hidden; }
  body { display: flex; flex-direction: column; height: 100dvh; }
  /* Shown over an opened session or the chat: what it is, and an X back to the board. */
  #head { display: flex; align-items: center; gap: 8px; padding: 4px 4px 4px 10px; background: var(--bar); flex-shrink: 0;
          font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; }
  #head[hidden] { display: none; }
  #head .key { color: var(--muted); flex-shrink: 0; }
  #head .title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #head a { display: grid; place-items: center; width: 36px; height: 32px; flex-shrink: 0; border-radius: 8px;
            color: var(--fg); font-size: 18px; text-decoration: none; }
  #head a:hover { background: var(--key); }
  #term { flex: 1; min-height: 0; padding: 4px 0 0 4px; }
  /* Wraps to fit the screen; buttons stretch to fill each row. */
  #keys { display: flex; flex-wrap: wrap; gap: 6px; padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
          background: var(--bar); flex-shrink: 0; }
  #keys a { display: flex; align-items: center; justify-content: center; flex: 1 1 auto; min-width: 44px; height: 40px; padding: 0 8px;
             border-radius: 8px; background: var(--key); color: var(--fg); font: 15px ui-monospace, SFMono-Regular, Menlo, monospace; text-decoration: none; }
  #keys button { flex: 1 1 auto; min-width: 44px; height: 40px; padding: 0 8px; border: 0; border-radius: 8px;
                 background: var(--key); color: var(--fg); font: 15px ui-monospace, SFMono-Regular, Menlo, monospace;
                 touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
                 -webkit-tap-highlight-color: transparent; }
  #keys button.down { background: var(--key-down); }
  #keys .back { font-weight: bold; font-size: 22px; }
  #keys .board svg { width: 20px; height: 20px; }
  #keys .mic svg { width: 18px; height: 18px; vertical-align: middle; }
  #keys .mic[hidden] { display: none; }
  #keys .mic.rec { background: #b91c1c; color: #fff; }
  #keys .mic.wait { opacity: .6; }
  /* Dictation's state, over the terminal's top right corner. */
  #dictate { position: fixed; top: 44px; right: 12px; max-width: min(440px, calc(100vw - 24px)); padding: 8px 12px; border-radius: 8px;
             background: #1f2937; color: var(--fg); box-shadow: 0 4px 16px rgba(0,0,0,.5); z-index: 5;
             font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; overflow-wrap: anywhere; pointer-events: none; }
  #dictate[hidden] { display: none; }
  #dictate.rec { background: #7f1d1d; }
  #overlay { position: fixed; inset: 0; display: none; place-items: center; background: rgba(0,0,0,.6);
             font: 16px ui-monospace, SFMono-Regular, Menlo, monospace; }
  #overlay.show { display: grid; }
  #overlay button { font: inherit; padding: 12px 20px; border-radius: 8px; border: 0; background: #2563eb; color: #fff; }
</style>
</head>
<body>
<div id="head" hidden><span class="key" id="headKey"></span><span class="title" id="headTitle"></span>
  <a href="/board" id="close" title="Close (Ctrl-Q or Alt-Q): back to the board, the session keeps running" aria-label="Close and go back to the board">✕</a></div>
<div id="term"></div>
<div id="keys">
  <button class="back" data-send="\x11" title="Back to the list (Ctrl-Q or Alt-Q)" aria-label="Back to the list">⇦</button>
  <button data-send="\x1b">Esc</button>
  <button data-send="\t">Tab</button>
  <button data-send="\x1b[A">↑</button>
  <button data-send="\x1b[B">↓</button>
  <button data-send="\x1b[D">←</button>
  <button data-send="\x1b[C">→</button>
  <button data-send="\r">Enter</button>
  <button data-send="\n" title="New line in Claude's composer (Ctrl-J)">C-j</button>
  <button data-send="\x03" title="Interrupt (Ctrl-C)">C-c</button>
  <button data-send="\x0c" data-fit title="Refit the terminal to this screen and redraw (Ctrl-L)">C-l</button>
  <button class="mic" id="mic" hidden title="Dictate into the session: click, speak, click again (or hold or tap Ctrl+Shift+Space); the words land at the prompt" aria-label="Dictate"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5.5" y="1.5" width="5" height="8" rx="2.5"/><path d="M3 7.5a5 5 0 0 0 10 0M8 12.5v2"/></svg></button>
  <a href="/board" class="board" title="Board" aria-label="Board"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="11" rx="2"/><path d="M6 2.5v11M10 2.5v11"/></svg></a>
</div>
<div id="dictate" hidden role="status"></div>
<div id="overlay"><button id="reconnect">Reconnect</button></div>
<script src="/xterm.js"></script>
<script src="/addon-fit.js"></script>
<script src="/addon-web-links.js"></script>
<script src="/mic.js"></script>
<script>
  const narrow = window.matchMedia("(max-width: 600px)").matches;
  const openLink = (uri) => { if (/^https?:\/\//i.test(uri)) window.open(uri, "_blank", "noopener"); };
  const term = new Terminal({
    fontFamily: 'ui-monospace, SFMono-Regular, Menlo, "DejaVu Sans Mono", monospace',
    // web.font_size, set by the server; 14 is the size it scales from.
    fontSize: Math.round((narrow ? 12 : 14) * (Number(document.documentElement.style.getPropertyValue("--font")) || 14) / 14),
    cursorBlink: true,
    scrollback: 0,
    theme: { background: "#111111" },
    // Claude's links (OSC 8). xterm.js's own handler asks first, then opens
    // a blank window and points it at the link, which loses the link in
    // `cl window`; this opens it in one step, in a new tab (or, in `cl
    // window`, the default browser).
    linkHandler: { activate: (e, uri) => openLink(uri) },
  });
  const fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  // Bare URLs too.
  term.loadAddon(new WebLinksAddon.WebLinksAddon((e, uri) => openLink(uri)));
  term.open(document.getElementById("term"));

  // A phone's keyboard (Gboard) types into xterm.js's hidden textarea as
  // compositions, and changes words already there: autocorrect swaps "itene"
  // for "Irene", a suggestion replaces the word being typed. xterm.js's own
  // handling sends text it already sent again then (the whole textarea, when
  // the length stays the same), and never deletes the word being replaced.
  // On a touch screen this takes over: the session is kept in step with the
  // textarea, so a change sends a backspace (DEL) for each character from the
  // first one that differs to the end, then the new text from there. Keys
  // xterm.js handles itself (Enter, Backspace in an empty field, a hardware
  // keyboard's letters, the key bar) and pastes pass through as before.
  const phoneKeys = matchMedia("(pointer: coarse)").matches ? (() => {
    const ta = term.textarea;
    // The textarea's text the session already has.
    let sent = ta.value;
    // After a key, a paste or the key bar, what is in the textarea counts as
    // sent: the session's cursor has moved on from it. Not cleared, so the
    // keyboard doesn't type its word in again.
    const settle = () => setTimeout(() => { sent = ta.value; }, 0);
    const sync = () => {
      const now = ta.value;
      let i = 0;
      while (i < sent.length && i < now.length && sent[i] === now[i]) i++;
      // Not between the two halves of a surrogate pair (an emoji).
      if (i > 0 && /[\ud800-\udbff]/.test(now[i - 1])) i--;
      const gone = Array.from(sent.slice(i)).length;
      const add = now.slice(i).replace(/\r?\n/g, "\r");
      sent = now;
      if (gone || add) term.input("\x7f".repeat(gone) + add);
    };
    // Captured on the way down, so xterm.js's own listeners on the textarea
    // (its composition helper, its input handler) never see these.
    const own = (e) => { if (e.target === ta) { e.stopPropagation(); return true; } return false; };
    for (const type of ["compositionstart", "compositionupdate", "compositionend"]) term.element.addEventListener(type, own, true);
    term.element.addEventListener("input", (e) => { if (own(e)) sync(); }, true);
    term.element.addEventListener("paste", settle, true);
    ta.addEventListener("blur", () => { sent = ""; }); // xterm.js empties it
    return {
      settle,
      // From xterm.js's custom key handler: false keeps a key from xterm.js.
      // A keyboard's keys mid-composition (keyCode 229) are its input
      // events', which sync() sends.
      keydown(e) {
        if (e.type !== "keydown") return true;
        if (e.keyCode === 229) return false;
        settle();
        return true;
      },
    };
  })() : null;

  // Copies made in the session reach the system clipboard: tmux (copy mode,
  // a mouse selection) and programs inside it (Claude Code) send them as OSC
  // 52, which xterm.js drops on its own. Requests to read the clipboard
  // ("?") are ignored. `cl window` lets the page write without a click
  // (javascript-can-access-clipboard); a browser may refuse when there was
  // none recently, or the tab isn't focused.
  term.parser.registerOscHandler(52, (data) => {
    const b64 = data.slice(data.indexOf(";") + 1);
    if (!b64 || b64 === "?") return true;
    let text;
    try {
      text = new TextDecoder().decode(Uint8Array.from(atob(b64), (c) => c.charCodeAt(0)));
    } catch { return true; }
    copyText(text);
    return true;
  });
  // Ctrl+Shift+C copies xterm.js's own selection (a Shift+drag, which tmux's
  // mouse mode leaves to the page), as in desktop terminals. Ctrl+Shift+V
  // pastes already: xterm.js leaves it to the browser's paste.
  term.attachCustomKeyEventHandler((e) => {
    if (phoneKeys && !phoneKeys.keydown(e)) return false;
    if (e.type !== "keydown" || !e.ctrlKey || !e.shiftKey || e.altKey || e.metaKey || e.code !== "KeyC" || !term.hasSelection()) return true;
    e.preventDefault();
    copyText(term.getSelection());
    return false;
  });
  function copyText(text) {
    // navigator.clipboard is only there in a secure context (https or
    // localhost); over plain http (tailscale), a copy command fills it.
    if (navigator.clipboard) { navigator.clipboard.writeText(text).catch(() => {}); return; }
    const fill = (e) => { e.clipboardData.setData("text/plain", text); e.preventDefault(); };
    document.addEventListener("copy", fill, { once: true, capture: true });
    try { document.execCommand("copy"); } finally { document.removeEventListener("copy", fill, { capture: true }); }
  }

  // A swipe on a phone only scrolls xterm.js's own scrollback, and there is
  // none: replay it as wheel events, which xterm.js hands to tmux (mouse on)
  // or turns into arrow keys for the chooser. Arrow keys whenever xterm.js
  // doesn't know mouse reporting is on, so a page that resumes a terminal
  // gets the modes set again (Modes in web.zig).
  {
    const el = document.getElementById("term");
    let lastY = null;
    let moved = false;
    el.addEventListener("touchstart", (e) => {
      lastY = e.touches.length === 1 ? e.touches[0].clientY : null;
      moved = false;
    }, { passive: true });
    el.addEventListener("touchmove", (e) => {
      if (lastY === null || e.touches.length !== 1) return;
      const t = e.touches[0];
      const dy = lastY - t.clientY;
      // Ignore the jitter of a tap.
      if (!moved && Math.abs(dy) < 8) return;
      moved = true;
      lastY = t.clientY;
      e.preventDefault();
      (document.elementFromPoint(t.clientX, t.clientY) || term.element).dispatchEvent(new WheelEvent("wheel", {
        deltaY: dy, deltaMode: WheelEvent.DOM_DELTA_PIXEL, clientX: t.clientX, clientY: t.clientY,
        bubbles: true, cancelable: true,
      }));
    }, { passive: false });
    el.addEventListener("touchend", () => { lastY = null; });
  }

  const overlay = document.getElementById("overlay");
  let ws = null;
  const enc = new TextEncoder();

  function send(kind, text) {
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(kind + text);
  }
  function sendSize() {
    fit.fit();
    send("1", term.cols + "," + term.rows);
  }

  // The server keeps this page's terminal for a while after the connection
  // drops (a phone backgrounding the tab), so reconnecting resumes it.
  // ?attach=<tmux name> (from the board) opens that session instead of the chooser.
  const attach = (new URLSearchParams(location.search).get("attach") || "").replace(/[^A-Za-z0-9_-]/g, "");
  const termId = (() => {
    try {
      const slot = "cl-term" + (attach ? "-" + attach : "");
      let id = sessionStorage.getItem(slot);
      if (!id) {
        id = Array.from(crypto.getRandomValues(new Uint8Array(12)), (b) => b.toString(16).padStart(2, "0")).join("");
        sessionStorage.setItem(slot, id);
      }
      return id;
    } catch { return ""; }
  })();
  // Opened from the board (a session or the chat): say what it is, with an X
  // back to the board. Leaving only detaches; reopening resumes it.
  if (attach) {
    const ticket = new URLSearchParams(location.search).get("ticket") || "";
    const show = (key, title) => {
      document.getElementById("headKey").textContent = key;
      document.getElementById("headTitle").textContent = title;
      document.title = (key ? key + " · " : "") + title;
    };
    if (attach === "operator") show("", "Chat with the operator");
    else if (attach === "voice") show("", "Voice operator");
    else if (!ticket) show("", attach);
    else {
      show(ticket, "");
      fetch("/api/ticket/" + encodeURIComponent(ticket)).then((r) => r.ok ? r.json() : null)
        .then((d) => { if (d?.ticket?.title) show(ticket, d.ticket.title); }).catch(() => {});
    }
    document.getElementById("head").hidden = false;
    document.querySelector('#keys a[href="/board"]').remove();
  }
  // Opened from the board, Ctrl-Q or Alt-Q does what the X does. In the
  // chooser, Alt-Q sends Ctrl-Q (back to the list), since Firefox keeps
  // Ctrl-Q for quitting. Caught on the way down, before xterm.js sees it, so
  // the session never gets ESC q, nor the XON (0x11) when it's closing.
  // Alt-Q goes by the key's position: with Option on a Mac, e.key is "œ".
  window.addEventListener("keydown", (e) => {
    if (e.shiftKey || e.metaKey || e.ctrlKey === e.altKey) return;
    if (e.ctrlKey ? !attach || (e.key !== "q" && e.key !== "Q") : e.code !== "KeyQ") return;
    e.preventDefault();
    e.stopImmediatePropagation();
    if (attach) document.getElementById("close").click();
    else send("0", "\x11");
  }, true);

  // Opened from the board (it notes when it's left; the note moves into this
  // page's history entry, so a reload keeps it): going back to the board is
  // going back in history. The browser then shows the board as it was, from
  // its back/forward cache, instead of loading it again. Opened any other
  // way (a link, a new tab), the board is loaded as before.
  const fromBoard = (() => {
    try {
      if (history.state?.fromBoard) return true;
      const left = Number(sessionStorage.getItem("cl-left-board") || 0);
      sessionStorage.removeItem("cl-left-board");
      if (history.length < 2 || !(Date.now() - left < 10000)) return false;
      history.replaceState({ ...history.state, fromBoard: true }, "");
      return true;
    } catch { return false; }
  })();
  document.addEventListener("click", (e) => {
    if (!fromBoard || e.defaultPrevented || e.button || e.ctrlKey || e.metaKey || e.shiftKey || e.altKey) return;
    if (!e.target.closest?.('a[href="/board"]')) return;
    e.preventDefault();
    // This page is next in history now: opening it again from the board
    // goes forward to it (board.html's openTerm).
    try { sessionStorage.setItem("cl-term-next", location.pathname + location.search); } catch {}
    history.back();
  });
  // Kept in the back/forward cache, this page keeps its screen but not its
  // connection (a page with an open WebSocket isn't kept): it lets go of the
  // terminal as an unloaded page does, and takes it up again when shown.
  addEventListener("pagehide", () => {
    clearTimeout(retryTimer);
    clearTimeout(probeTimer);
    if (ws) { ws.onclose = null; ws.close(); ws = null; }
  });
  addEventListener("pageshow", (e) => {
    try { sessionStorage.removeItem("cl-term-next"); sessionStorage.removeItem("cl-left-board"); } catch {}
    // (Unless coming back visible already did.)
    if (e.persisted && !ws && !overlay.classList.contains("show")) { retries = 0; connect(); }
  });

  let retries = 0;
  let retryTimer = 0;
  let probeTimer = 0;

  function connect() {
    clearTimeout(retryTimer);
    overlay.classList.remove("show");
    if (ws) { ws.onclose = null; ws.close(); }
    const sock = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws?t=" + termId + (attach ? "&a=" + attach : ""));
    ws = sock;
    sock.binaryType = "arraybuffer";
    sock.onopen = () => {
      retries = 0;
      sendSize();
      send("2", document.hidden ? "1" : "0");
      term.focus();
    };
    sock.onmessage = (e) => {
      clearTimeout(probeTimer);
      // "new" or "resumed". A resumed terminal's server sends the modes its
      // programs set (tmux's mouse reporting) again, then a redraw.
      if (typeof e.data === "string") { if (e.data === "new") term.reset(); return; }
      term.write(new Uint8Array(e.data));
    };
    sock.onclose = (e) => {
      if (ws !== sock) return;
      ws = null;
      // A close frame from the server (1005) means the chooser quit or another
      // tab took this terminal: stay closed. Anything else is a lost
      // connection: retry while visible, or when shown again.
      if (e.code === 1005 || retries >= 5) { overlay.classList.add("show"); return; }
      if (!document.hidden) retryTimer = setTimeout(connect, 500 * 2 ** retries++);
    };
  }

  term.onData((d) => send("0", d));
  // While the page is hidden, its size shouldn't drive the session's window.
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) { send("2", "1"); return; }
    if (overlay.classList.contains("show")) return;
    if (!ws) { retries = 0; connect(); return; }
    send("2", "0");
    sendSize();
    // A socket can look open after the phone dropped it; ask, and reconnect
    // if nothing comes back.
    if (ws.readyState === WebSocket.OPEN) {
      send("3", "");
      clearTimeout(probeTimer);
      probeTimer = setTimeout(() => { retries = 0; connect(); }, 2500);
    }
  });
  document.getElementById("reconnect").onclick = () => { retries = 0; connect(); };

  // Keys fire on touchstart (phones) or click (mouse). preventDefault on
  // touchstart/mousedown keeps focus, so the on-screen keyboard stays open;
  // on touch it also suppresses the click that would send the key twice.
  for (const b of document.querySelectorAll("#keys button[data-send]")) {
    const seq = JSON.parse('"' + b.dataset.send.replace(/\\x/g, "\\u00") + '"');
    const fire = () => {
      if (!ws) { retries = 0; connect(); return; }
      if (ws.readyState !== WebSocket.OPEN) return;
      // C-l first refits the page's terminal (after a rotation, say) so the
      // Ctrl-L that follows fits the session's window to the new size.
      if ("fit" in b.dataset) sendSize();
      send("0", seq);
      phoneKeys?.settle();
      b.classList.add("down");
      setTimeout(() => b.classList.remove("down"), 120);
    };
    b.addEventListener("touchstart", (e) => { e.preventDefault(); fire(); }, { passive: false });
    b.addEventListener("mousedown", (e) => e.preventDefault());
    b.addEventListener("click", fire);
  }

  let resizeTimer = 0;
  const onResize = () => {
    // iOS keeps 100dvh under the on-screen keyboard; size to what is visible.
    if (window.visualViewport) document.body.style.height = window.visualViewport.height + "px";
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(sendSize, 80);
  };
  window.addEventListener("resize", onResize);
  if (window.visualViewport) window.visualViewport.addEventListener("resize", onResize);

  // ---- dictation (voice.stt; README, "Dictating into a session") ----
  // The mic button, or Ctrl+Shift+Space, records here in the page; cl web
  // turns it into words with voice.stt (the board's mic does the same for
  // the operator), and they are pasted into the session, where Claude's
  // prompt takes them like typing. Enter stays with the human. The key
  // works both ways: hold it while speaking and let go, or tap it, speak,
  // and tap again. A browser sees the key go up, so holding works here
  // whatever tmux does with keys. Esc cancels, while it listens or while
  // the words are being worked out.
  // `gen` tells a start whose mic arrives late that it was stopped (and maybe
  // started again) meanwhile; `abort` stops the request for the words.
  const dict = { want: false, rec: null, busy: false, pressAt: 0, holding: false, hide: 0, gen: 0, abort: null };
  const HOLD_MS = 400;
  const micBtn = document.getElementById("mic");
  function dictateShow(text, cls, ms) {
    const el = document.getElementById("dictate");
    clearTimeout(dict.hide);
    el.hidden = !text; el.textContent = text || ""; el.className = cls || "";
    if (ms) dict.hide = setTimeout(() => { el.hidden = true; }, ms);
  }
  const micState = (cls) => { micBtn.className = "mic" + (cls ? " " + cls : ""); };
  async function dictateStart() {
    if (dict.want || dict.rec || dict.busy || micBtn.hidden) return;
    if (!micAllowed()) { dictateShow(MIC_NO_HTTPS, "", 5000); return; }
    dict.want = true;
    const gen = ++dict.gen;
    micState("rec");
    dictateShow("Listening…  let go of Ctrl+Shift+Space, or press it (or the mic) again, to type it in. Esc cancels.", "rec");
    let rec;
    try { rec = await micOpen(); }
    catch (e) {
      if (gen !== dict.gen) return;
      dict.want = false; micState(""); dictateShow("No microphone: " + e.message, "", 5000); return;
    }
    if (!dict.want || gen !== dict.gen) { micClose(rec); return; } // stopped already
    dict.rec = rec;
  }
  async function dictateStop(cancel) {
    const wanted = dict.want;
    dict.want = false;
    dict.gen++;
    const r = dict.rec;
    dict.rec = null;
    micState("");
    if (!r) { if (wanted) dictateShow(null); return; }
    const { chunks, rate, ms } = micClose(r);
    if (cancel || ms < 300) { dictateShow(null); return; }
    if (loudest(chunks) < MIC_QUIET) { dictateShow("Didn't hear anything.", "", 3000); return; }
    dict.busy = true;
    const abort = dict.abort = new AbortController();
    micState("wait");
    dictateShow("Working out what you said…  Esc cancels.");
    try {
      const res = await fetch("/api/voice/text", { method: "POST", headers: { "content-type": "audio/wav" }, body: wavOf(chunks, rate, 16000), signal: abort.signal });
      const j = await res.json().catch(() => ({}));
      if (abort.signal.aborted) { dictateShow(null); return; }
      if (!res.ok) throw new Error(j.error || res.statusText);
      if (!ws || ws.readyState !== WebSocket.OPEN) throw new Error("Not connected, so it wasn't typed in. You said: " + j.text);
      // A paste, so a program that asked for bracketed paste (Claude Code,
      // through tmux) takes it as text, newlines and all, without sending it.
      term.paste(j.text + " ");
      dictateShow(null);
    } catch (e) {
      dictateShow(abort.signal.aborted ? null : e.message, "", 8000);
    } finally { dict.busy = false; dict.abort = null; micState(""); term.focus(); }
  }
  // Ask whether voice is on; without voice.stt there's no mic and the key
  // goes to the terminal as usual.
  fetch("/api/voice/on").then((r) => r.ok ? r.json() : null).then((j) => { micBtn.hidden = !j?.on; }).catch(() => {});
  micBtn.addEventListener("mousedown", (e) => e.preventDefault()); // keep the terminal's focus
  micBtn.addEventListener("touchstart", (e) => { e.preventDefault(); micBtn.click(); }, { passive: false });
  micBtn.addEventListener("click", () => (dict.want || dict.rec ? dictateStop(false) : dictateStart()));
  const isDictateKey = (e) => e.code === "Space" && e.ctrlKey && e.shiftKey && !e.altKey && !e.metaKey;
  // Caught on the way down, before xterm.js, so the session gets neither
  // the key (Ctrl+Space is NUL) nor the Esc that cancels.
  window.addEventListener("keydown", (e) => {
    if (micBtn.hidden) return;
    if (e.key === "Escape" && (dict.want || dict.rec || dict.abort)) {
      e.preventDefault(); e.stopImmediatePropagation();
      if (dict.abort) dict.abort.abort();
      else dictateStop(true);
      return;
    }
    // Still holding Space after letting go of Ctrl or Shift: its repeats
    // aren't for the session either.
    if (dict.holding && e.code === "Space" && !isDictateKey(e)) { e.preventDefault(); e.stopImmediatePropagation(); return; }
    if (!isDictateKey(e)) return;
    e.preventDefault(); e.stopImmediatePropagation();
    if (e.repeat) return;
    if (dict.want || dict.rec) { dict.holding = false; dictateStop(false); return; }
    dict.pressAt = Date.now(); dict.holding = true;
    dictateStart();
  }, true);
  // Let go after holding it: send. A quick tap keeps recording until the next.
  const letGo = () => {
    if (!dict.holding) return;
    dict.holding = false;
    if ((dict.want || dict.rec) && Date.now() - dict.pressAt >= HOLD_MS) dictateStop(false);
  };
  window.addEventListener("keyup", (e) => {
    if (e.code !== "Space" || !dict.holding) return;
    e.preventDefault(); e.stopImmediatePropagation();
    letGo();
  }, true);
  // The window losing focus mid-hold never sees the key go up.
  window.addEventListener("blur", letGo);

  connect();
</script>
</body>
</html>
