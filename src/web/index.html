<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>cl</title>
<link rel="stylesheet" href="/xterm.css">
<style>
  :root { --bg: #111; --bar: #1c1c1c; --key: #2a2a2a; --key-down: #3a3a3a; --fg: #e5e5e5; --muted: #999; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); overflow: hidden; }
  body { display: flex; flex-direction: column; height: 100dvh; }
  /* Shown over an opened session or the chat: what it is, and an X back to the board. */
  #head { display: flex; align-items: center; gap: 8px; padding: 4px 4px 4px 10px; background: var(--bar); flex-shrink: 0;
          font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; }
  #head[hidden] { display: none; }
  #head .key { color: var(--muted); flex-shrink: 0; }
  #head .title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #head a { display: grid; place-items: center; width: 36px; height: 32px; flex-shrink: 0; border-radius: 8px;
            color: var(--fg); font-size: 18px; text-decoration: none; }
  #head a:hover { background: var(--key); }
  #term { flex: 1; min-height: 0; padding: 4px 0 0 4px; }
  /* Wraps to fit the screen; buttons stretch to fill each row. */
  #keys { display: flex; flex-wrap: wrap; gap: 6px; padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
          background: var(--bar); flex-shrink: 0; }
  #keys a { display: flex; align-items: center; justify-content: center; flex: 1 1 auto; min-width: 44px; height: 40px; padding: 0 8px;
             border-radius: 8px; background: var(--key); color: var(--fg); font: 15px ui-monospace, SFMono-Regular, Menlo, monospace; text-decoration: none; }
  #keys button { flex: 1 1 auto; min-width: 44px; height: 40px; padding: 0 8px; border: 0; border-radius: 8px;
                 background: var(--key); color: var(--fg); font: 15px ui-monospace, SFMono-Regular, Menlo, monospace;
                 touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
                 -webkit-tap-highlight-color: transparent; }
  #keys button.down { background: var(--key-down); }
  #keys .back { font-weight: bold; font-size: 22px; }
  #keys .board svg { width: 20px; height: 20px; }
  #overlay { position: fixed; inset: 0; display: none; place-items: center; background: rgba(0,0,0,.6);
             font: 16px ui-monospace, SFMono-Regular, Menlo, monospace; }
  #overlay.show { display: grid; }
  #overlay button { font: inherit; padding: 12px 20px; border-radius: 8px; border: 0; background: #2563eb; color: #fff; }
</style>
</head>
<body>
<div id="head" hidden><span class="key" id="headKey"></span><span class="title" id="headTitle"></span>
  <a href="/board" id="close" title="Close (Ctrl-Q or Alt-Q): back to the board, the session keeps running" aria-label="Close and go back to the board">✕</a></div>
<div id="term"></div>
<div id="keys">
  <button class="back" data-send="\x11" title="Back to the list (Ctrl-Q or Alt-Q)" aria-label="Back to the list">⇦</button>
  <button data-send="\x1b">Esc</button>
  <button data-send="\t">Tab</button>
  <button data-send="\x1b[A">↑</button>
  <button data-send="\x1b[B">↓</button>
  <button data-send="\x1b[D">←</button>
  <button data-send="\x1b[C">→</button>
  <button data-send="\r">Enter</button>
  <button data-send="\n" title="New line in Claude's composer (Ctrl-J)">C-j</button>
  <button data-send="\x03" title="Interrupt (Ctrl-C)">C-c</button>
  <button data-send="\x0c" data-fit title="Refit the terminal to this screen and redraw (Ctrl-L)">C-l</button>
  <a href="/board" class="board" title="Board" aria-label="Board"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="11" rx="2"/><path d="M6 2.5v11M10 2.5v11"/></svg></a>
</div>
<div id="overlay"><button id="reconnect">Reconnect</button></div>
<script src="/xterm.js"></script>
<script src="/addon-fit.js"></script>
<script src="/addon-web-links.js"></script>
<script>
  const narrow = window.matchMedia("(max-width: 600px)").matches;
  const openLink = (uri) => { if (/^https?:\/\//i.test(uri)) window.open(uri, "_blank", "noopener"); };
  const term = new Terminal({
    fontFamily: 'ui-monospace, SFMono-Regular, Menlo, "DejaVu Sans Mono", monospace',
    // web.font_size, set by the server; 14 is the size it scales from.
    fontSize: Math.round((narrow ? 12 : 14) * (Number(document.documentElement.style.getPropertyValue("--font")) || 14) / 14),
    cursorBlink: true,
    scrollback: 0,
    theme: { background: "#111111" },
    // Claude's links (OSC 8). xterm.js's own handler asks first, then opens
    // a blank window and points it at the link, which loses the link in
    // `cl window`; this opens it in one step, in a new tab (or, in `cl
    // window`, the default browser).
    linkHandler: { activate: (e, uri) => openLink(uri) },
  });
  const fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  // Bare URLs too.
  term.loadAddon(new WebLinksAddon.WebLinksAddon((e, uri) => openLink(uri)));
  term.open(document.getElementById("term"));

  // Copies made in the session reach the system clipboard: tmux (copy mode,
  // a mouse selection) and programs inside it (Claude Code) send them as OSC
  // 52, which xterm.js drops on its own. Requests to read the clipboard
  // ("?") are ignored. `cl window` lets the page write without a click
  // (javascript-can-access-clipboard); a browser may refuse when there was
  // none recently, or the tab isn't focused.
  term.parser.registerOscHandler(52, (data) => {
    const b64 = data.slice(data.indexOf(";") + 1);
    if (!b64 || b64 === "?") return true;
    let text;
    try {
      text = new TextDecoder().decode(Uint8Array.from(atob(b64), (c) => c.charCodeAt(0)));
    } catch { return true; }
    copyText(text);
    return true;
  });
  // Ctrl+Shift+C copies xterm.js's own selection (a Shift+drag, which tmux's
  // mouse mode leaves to the page), as in desktop terminals. Ctrl+Shift+V
  // pastes already: xterm.js leaves it to the browser's paste.
  term.attachCustomKeyEventHandler((e) => {
    if (e.type !== "keydown" || !e.ctrlKey || !e.shiftKey || e.altKey || e.metaKey || e.code !== "KeyC" || !term.hasSelection()) return true;
    e.preventDefault();
    copyText(term.getSelection());
    return false;
  });
  function copyText(text) {
    // navigator.clipboard is only there in a secure context (https or
    // localhost); over plain http (tailscale), a copy command fills it.
    if (navigator.clipboard) { navigator.clipboard.writeText(text).catch(() => {}); return; }
    const fill = (e) => { e.clipboardData.setData("text/plain", text); e.preventDefault(); };
    document.addEventListener("copy", fill, { once: true, capture: true });
    try { document.execCommand("copy"); } finally { document.removeEventListener("copy", fill, { capture: true }); }
  }

  // A swipe on a phone only scrolls xterm.js's own scrollback, and there is
  // none: replay it as wheel events, which xterm.js hands to tmux (mouse on)
  // or turns into arrow keys for the chooser.
  {
    const el = document.getElementById("term");
    let lastY = null;
    let moved = false;
    el.addEventListener("touchstart", (e) => {
      lastY = e.touches.length === 1 ? e.touches[0].clientY : null;
      moved = false;
    }, { passive: true });
    el.addEventListener("touchmove", (e) => {
      if (lastY === null || e.touches.length !== 1) return;
      const t = e.touches[0];
      const dy = lastY - t.clientY;
      // Ignore the jitter of a tap.
      if (!moved && Math.abs(dy) < 8) return;
      moved = true;
      lastY = t.clientY;
      e.preventDefault();
      (document.elementFromPoint(t.clientX, t.clientY) || term.element).dispatchEvent(new WheelEvent("wheel", {
        deltaY: dy, deltaMode: WheelEvent.DOM_DELTA_PIXEL, clientX: t.clientX, clientY: t.clientY,
        bubbles: true, cancelable: true,
      }));
    }, { passive: false });
    el.addEventListener("touchend", () => { lastY = null; });
  }

  const overlay = document.getElementById("overlay");
  let ws = null;
  const enc = new TextEncoder();

  function send(kind, text) {
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(kind + text);
  }
  function sendSize() {
    fit.fit();
    send("1", term.cols + "," + term.rows);
  }

  // The server keeps this page's terminal for a while after the connection
  // drops (a phone backgrounding the tab), so reconnecting resumes it.
  // ?attach=<tmux name> (from the board) opens that session instead of the chooser.
  const attach = (new URLSearchParams(location.search).get("attach") || "").replace(/[^A-Za-z0-9_-]/g, "");
  const termId = (() => {
    try {
      const slot = "cl-term" + (attach ? "-" + attach : "");
      let id = sessionStorage.getItem(slot);
      if (!id) {
        id = Array.from(crypto.getRandomValues(new Uint8Array(12)), (b) => b.toString(16).padStart(2, "0")).join("");
        sessionStorage.setItem(slot, id);
      }
      return id;
    } catch { return ""; }
  })();
  // Opened from the board (a session or the chat): say what it is, with an X
  // back to the board. Leaving only detaches; reopening resumes it.
  if (attach) {
    const ticket = new URLSearchParams(location.search).get("ticket") || "";
    const show = (key, title) => {
      document.getElementById("headKey").textContent = key;
      document.getElementById("headTitle").textContent = title;
      document.title = (key ? key + " · " : "") + title;
    };
    if (attach === "operator") show("", "Chat with the operator");
    else if (!ticket) show("", attach);
    else {
      show(ticket, "");
      fetch("/api/ticket/" + encodeURIComponent(ticket)).then((r) => r.ok ? r.json() : null)
        .then((d) => { if (d?.ticket?.title) show(ticket, d.ticket.title); }).catch(() => {});
    }
    document.getElementById("head").hidden = false;
    document.querySelector('#keys a[href="/board"]').remove();
  }
  // Opened from the board, Ctrl-Q or Alt-Q does what the X does. In the
  // chooser, Alt-Q sends Ctrl-Q (back to the list), since Firefox keeps
  // Ctrl-Q for quitting. Caught on the way down, before xterm.js sees it, so
  // the session never gets ESC q, nor the XON (0x11) when it's closing.
  // Alt-Q goes by the key's position: with Option on a Mac, e.key is "œ".
  window.addEventListener("keydown", (e) => {
    if (e.shiftKey || e.metaKey || e.ctrlKey === e.altKey) return;
    if (e.ctrlKey ? !attach || (e.key !== "q" && e.key !== "Q") : e.code !== "KeyQ") return;
    e.preventDefault();
    e.stopImmediatePropagation();
    if (attach) document.getElementById("close").click();
    else send("0", "\x11");
  }, true);

  let retries = 0;
  let retryTimer = 0;
  let probeTimer = 0;

  function connect() {
    clearTimeout(retryTimer);
    overlay.classList.remove("show");
    if (ws) { ws.onclose = null; ws.close(); }
    const sock = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws?t=" + termId + (attach ? "&a=" + attach : ""));
    ws = sock;
    sock.binaryType = "arraybuffer";
    sock.onopen = () => {
      retries = 0;
      sendSize();
      send("2", document.hidden ? "1" : "0");
      term.focus();
    };
    sock.onmessage = (e) => {
      clearTimeout(probeTimer);
      // "new" or "resumed": a resumed terminal keeps the modes its programs
      // set (tmux's mouse reporting), which a reset would lose.
      if (typeof e.data === "string") { if (e.data === "new") term.reset(); return; }
      term.write(new Uint8Array(e.data));
    };
    sock.onclose = (e) => {
      if (ws !== sock) return;
      ws = null;
      // A close frame from the server (1005) means the chooser quit or another
      // tab took this terminal: stay closed. Anything else is a lost
      // connection: retry while visible, or when shown again.
      if (e.code === 1005 || retries >= 5) { overlay.classList.add("show"); return; }
      if (!document.hidden) retryTimer = setTimeout(connect, 500 * 2 ** retries++);
    };
  }

  term.onData((d) => send("0", d));
  // While the page is hidden, its size shouldn't drive the session's window.
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) { send("2", "1"); return; }
    if (overlay.classList.contains("show")) return;
    if (!ws) { retries = 0; connect(); return; }
    send("2", "0");
    sendSize();
    // A socket can look open after the phone dropped it; ask, and reconnect
    // if nothing comes back.
    if (ws.readyState === WebSocket.OPEN) {
      send("3", "");
      clearTimeout(probeTimer);
      probeTimer = setTimeout(() => { retries = 0; connect(); }, 2500);
    }
  });
  document.getElementById("reconnect").onclick = () => { retries = 0; connect(); };

  // Keys fire on touchstart (phones) or click (mouse). preventDefault on
  // touchstart/mousedown keeps focus, so the on-screen keyboard stays open;
  // on touch it also suppresses the click that would send the key twice.
  for (const b of document.querySelectorAll("#keys button")) {
    const seq = JSON.parse('"' + b.dataset.send.replace(/\\x/g, "\\u00") + '"');
    const fire = () => {
      if (!ws) { retries = 0; connect(); return; }
      if (ws.readyState !== WebSocket.OPEN) return;
      // C-l first refits the page's terminal (after a rotation, say) so the
      // Ctrl-L that follows fits the session's window to the new size.
      if ("fit" in b.dataset) sendSize();
      send("0", seq);
      b.classList.add("down");
      setTimeout(() => b.classList.remove("down"), 120);
    };
    b.addEventListener("touchstart", (e) => { e.preventDefault(); fire(); }, { passive: false });
    b.addEventListener("mousedown", (e) => e.preventDefault());
    b.addEventListener("click", fire);
  }

  let resizeTimer = 0;
  const onResize = () => {
    // iOS keeps 100dvh under the on-screen keyboard; size to what is visible.
    if (window.visualViewport) document.body.style.height = window.visualViewport.height + "px";
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(sendSize, 80);
  };
  window.addEventListener("resize", onResize);
  if (window.visualViewport) window.visualViewport.addEventListener("resize", onResize);

  connect();
</script>
</body>
</html>
