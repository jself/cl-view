<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>cl</title>
<style>
  :root { --bg: #fafafa; --fg: #1a1a1a; --muted: #666; --field: #fff; --line: #ccc; --accent: #2563eb; --err: #b91c1c; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111; --fg: #e5e5e5; --muted: #999; --field: #1c1c1c; --line: #333; --accent: #60a5fa; --err: #f87171; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
         font: 16px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; padding: 16px; }
  form { width: 100%; max-width: 320px; display: grid; gap: 12px; }
  h1 { margin: 0 0 4px; font-size: 20px; }
  input, button { font: inherit; padding: 12px; border-radius: 8px; border: 1px solid var(--line); }
  input { background: var(--field); color: var(--fg); }
  button { background: var(--accent); color: #fff; border-color: transparent; }
  .err { color: var(--err); margin: 0; }
</style>
</head>
<body>
<form method="post" action="/login">
  <h1>cl</h1>
  <!--error-->
  <input type="password" name="password" placeholder="password" autocomplete="current-password" autofocus required>
  <button type="submit">Sign in</button>
</form>
</body>
</html>
