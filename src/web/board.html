<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<meta name="color-scheme" content="dark">
<title>cl board</title>
<style>
  :root {
    --bg: #111214; --panel: #16171a; --card: #1f2024; --line: #2c2e33; --line2: #24262a;
    --fg: #ececec; --muted: #a0a3a8; --dim: #b4b6ba; --accent: #2a4f86; --accent-fg: #fff;
    --input: #ffc861; --input-bg: #3a2a0b; --question: #cdb8ff; --question-bg: #2c2440;
    --review: #9cc6ff; --review-bg: #11294a; --testing: #7ee6d6; --testing-bg: #0f3330;
    --other: #d6d7da; --other-bg: #2c2e33; --finishing: #b6e3a0; --finishing-bg: #1b3317;
    --conflict: #ffb4b4; --conflict-bg: #3d1a1a;
    --mono: ui-monospace, SFMono-Regular, Menlo, "DejaVu Sans Mono", monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.4 var(--sans); }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: #8fbcff; }
  .mono { font-family: var(--mono); }
  .muted { color: var(--muted); }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line2); }
  header .title { font: 500 17px var(--mono); }
  header .grow { flex: 1 1 40px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 36px; padding: 0 12px;
         border-radius: 8px; border: 1px solid var(--line); background: #26282d; color: #e6e7e9; cursor: pointer; text-decoration: none; white-space: nowrap; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  .btn.danger { border-color: #6b2b2b; color: #ffb4b4; }
  .btn:disabled { opacity: .5; cursor: default; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .seg button { min-height: 36px; padding: 0 12px; border: 0; background: #18191c; color: #c4c6ca; cursor: pointer; }
  .seg button.on { background: var(--line); color: #fff; }
  input[type=search], input[type=text], select, textarea {
    min-height: 36px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: #18191c; }
  textarea { width: 100%; resize: vertical; }
  #search { min-width: 0; flex: 1 1 180px; max-width: 320px; }

  #needs { margin: 12px 16px 0; border: 1px solid #3a2f1a; background: #17150f; border-radius: 14px; }
  #needs > button { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 46px; padding: 0 14px; border: 0;
                    background: transparent; cursor: pointer; text-align: left; font-weight: 600; font-size: 15px; }
  #needs .count { font-family: var(--mono); color: var(--input); }
  #needs > button > span:first-child { white-space: nowrap; }
  #needs .sum { font-weight: 400; font-size: 13px; color: #b9ad94; }
  #needs .strip { display: flex; gap: 12px; overflow-x: auto; padding: 0 14px 14px; scroll-snap-type: x mandatory; }
  #needs.closed .strip { display: none; }
  .ask { flex: none; width: 300px; max-width: 85vw; scroll-snap-align: start; background: #1a1b1e; border: 1px solid var(--line);
         border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .ask .what { font-size: 12.5px; color: var(--dim); line-height: 1.45; overflow-wrap: anywhere; }
  .ask .acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; }

  nav#filters { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 12px 16px; }
  .chip { display: inline-flex; align-items: center; gap: 7px; min-height: 34px; padding: 0 12px; border-radius: 17px;
          border: 1px solid var(--line); background: #18191c; color: #d6d7da; cursor: pointer; white-space: nowrap; flex: none; }
  .chip.on { background: #ececec; color: #111214; border-color: #ececec; }
  .chip .n { font: 12px var(--mono); opacity: .8; }

  main { padding: 0 16px 32px; }
  .cols { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(230px, 1fr); gap: 12px; overflow-x: auto;
          align-items: start; scroll-snap-type: x mandatory; padding-bottom: 8px; }
  .col { background: var(--panel); border: 1px solid #222428; border-radius: 12px; padding: 10px; display: flex; flex-direction: column;
         gap: 8px; min-height: 160px; scroll-snap-align: start; }
  .col h2 { margin: 0; font-size: 13px; font-weight: 600; display: flex; gap: 8px; align-items: center; padding: 2px 4px; }
  .col h2 .n { font: 12px var(--mono); color: var(--muted); }
  .card { width: 100%; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 11px;
          display: flex; flex-direction: column; gap: 6px; cursor: pointer; color: var(--fg); }
  .card.hot { border-color: #f5a524; }
  .card .top { display: flex; gap: 8px; font: 11.5px var(--mono); color: var(--muted); }
  .card .top .grow { flex: 1; }
  .card .t { font-size: 14px; font-weight: 500; line-height: 1.35; }
  .card .meta { font: 11.5px var(--mono); color: var(--dim); overflow-wrap: anywhere; }
  .card .sub { font: 11.5px var(--mono); color: var(--question); }
  .card[data-drag] { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  .card.lifted { opacity: .35; }
  #ghost { position: fixed; z-index: 20; pointer-events: none; margin: 0; box-shadow: 0 12px 32px rgba(0,0,0,.55); transform: rotate(1.5deg); opacity: .95; }
  .drop-on { outline: 2px dashed #60a5fa; outline-offset: -2px; background: #16202e; }
  .lanes td.drop-on { border-radius: 10px; }
  /* Where a dragged card would land in its column: a line in the gap between cards. */
  .card { position: relative; }
  .card.ins-above::before, .card.ins-below::after { content: ""; position: absolute; left: 4px; right: 4px; height: 3px; border-radius: 2px;
    background: #60a5fa; pointer-events: none; z-index: 21; box-shadow: 0 0 0 1px #0b0b0c; } /* over the ghost */
  .card.ins-above::before { top: -6px; } .card.ins-below::after { bottom: -6px; }
  .lanes .card.ins-above::before { top: -5px; } .lanes .card.ins-below::after { bottom: -5px; }
  .status { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; color: #d6d7da; }
  .dot { width: 8px; height: 8px; border-radius: 4px; flex: none; display: inline-block; background: #5d6168; }
  .s-busy { background: #60a5fa; } .s-waiting, .s-blocked { background: #f5a524; } .s-idle { background: #a0a3a8; }
  .s-shell { background: #2dd4bf; } .s-gone { background: #f87171; } .s-starting { background: #a78bfa; } .s-none { background: transparent; border: 1px solid #5d6168; }
  .pills { display: flex; flex-wrap: wrap; gap: 5px; }
  .pill { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 11px; font-size: 11.5px;
          background: var(--other-bg); color: var(--other); white-space: nowrap; }
  .f-input { background: var(--input-bg); color: var(--input); } .f-question { background: var(--question-bg); color: var(--question); }
  .f-review { background: var(--review-bg); color: var(--review); } .f-testing { background: var(--testing-bg); color: var(--testing); }
  .f-conflict { background: var(--conflict-bg); color: var(--conflict); }
  .f-finishing { background: var(--finishing-bg); color: var(--finishing); }

  .lanes { overflow-x: auto; }
  .lanes table { border-collapse: separate; border-spacing: 8px 0; min-width: 1100px; width: 100%; }
  .lanes th { text-align: left; font-size: 11.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 4px 0; }
  .lanes td { vertical-align: top; padding: 10px 0; border-top: 1px solid var(--line2); }
  .lanes td.lane { width: 150px; }
  .lanes td > div { display: flex; flex-direction: column; gap: 6px; }

  .list { overflow-x: auto; border: 1px solid var(--line2); border-radius: 12px; }
  .list table { border-collapse: collapse; width: 100%; min-width: 900px; }
  .list th { text-align: left; font-size: 11.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted);
             background: #18191c; padding: 9px 12px; }
  .list td { padding: 9px 12px; border-top: 1px solid var(--line2); vertical-align: top; }
  .list tr.row { cursor: pointer; }
  .list tr.row:hover td { background: #17181b; }

  dialog { padding: 0; border: 1px solid var(--line); border-radius: 16px; background: #17181b; color: var(--fg);
           width: min(900px, calc(100vw - 24px)); max-height: calc(100dvh - 40px); }
  dialog::backdrop { background: rgba(5, 5, 6, .66); }
  .dlg { padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 12px; }
  .dlg .head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .dlg h1 { margin: 0; font-size: 21px; font-weight: 600; overflow-wrap: anywhere; }
  .dlg .facts { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--dim); }
  .dlg .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .tabs { display: flex; gap: 18px; border-bottom: 1px solid var(--line); overflow-x: auto; }
  .tabs button { min-height: 40px; padding: 0 2px; border: 0; border-bottom: 2px solid transparent; background: none; color: var(--muted); cursor: pointer; white-space: nowrap; }
  .tabs button.on { color: #fff; border-bottom-color: #7fb2ff; }
  pre.term { margin: 0; background: #0b0b0c; border: 1px solid var(--line2); border-radius: 10px; padding: 10px 12px; font: 12px/1.5 var(--mono);
             white-space: pre-wrap; overflow-wrap: anywhere; max-height: 50vh; overflow-y: auto; }
  .opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 8px; }
  .opt { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 10px 12px; border: 1px solid var(--line);
         border-radius: 10px; background: var(--card); cursor: pointer; text-align: left; }
  .opt.on { border-color: #a78bfa; background: #231f33; }
  .opt small { color: var(--muted); }
  .q { display: flex; flex-direction: column; gap: 8px; padding-bottom: 10px; }
  .q + .q { border-top: 1px solid var(--line2); padding-top: 12px; }
  .comment { padding: 9px 12px; border-radius: 10px; background: var(--card); }
  .comment .who { font-size: 12px; color: var(--muted); }
  .comment .body { white-space: pre-wrap; overflow-wrap: anywhere; }
  .comment.claude { background: #1b1f27; }
  .form { display: grid; gap: 12px; }
  .form label { display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; color: var(--muted); }
  .form .row2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
  .check { display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; }
  .check .pf { display: flex; gap: 6px; }
  .check .pf .on.pass { background: #14532d; border-color: #14532d; }
  .check .pf .on.fail { background: #7f1d1d; border-color: #7f1d1d; }
  #toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: #2c2e33; color: #fff; padding: 10px 16px;
           border-radius: 10px; display: none; max-width: calc(100vw - 32px); z-index: 10; }
  #toast.err { background: #7f1d1d; }
  .empty { color: var(--muted); padding: 24px 4px; }
  @media (max-width: 640px) {
    header { padding: 10px 12px; } main { padding: 0 12px 24px; } nav#filters { padding: 10px 12px; flex-wrap: nowrap; overflow-x: auto; }
    #needs { margin: 10px 12px 0; } #needs .sum#needsSum { display: none; } #search { max-width: none; }
    .cols { grid-auto-columns: 86vw; }
    dialog { width: 100vw; max-width: 100vw; height: 100dvh; max-height: 100dvh; border-radius: 0; margin: 0; }
    .dlg { padding: 14px; }
  }
</style>
</head>
<body>
<header>
  <span class="title">cl board</span>
  <span id="summary" class="muted"></span>
  <span class="grow"></span>
  <input id="search" type="search" placeholder="Search tickets" aria-label="Search tickets">
  <div class="seg" role="group" aria-label="View">
    <button type="button" data-view="board">Board</button><button type="button" data-view="lanes">Lanes</button><button type="button" data-view="list">List</button>
  </div>
  <a class="btn" href="/">Terminal</a>
  <a class="btn" href="/?attach=operator" title="Talk to the operator: it can make tickets and check on sessions">Chat</a>
  <button type="button" class="btn primary" id="newBtn">New ticket</button>
</header>

<section id="needs" aria-label="Needs you">
  <button type="button" id="needsToggle" aria-expanded="true"><span>Needs you</span><span class="count" id="needsCount">0</span>
    <span class="sum" id="needsSum"></span><span style="flex:1"></span><span class="sum" id="needsHint">Collapse</span></button>
  <div class="strip" id="needsStrip"></div>
</section>

<nav id="filters" aria-label="Filters"></nav>
<main id="main"></main>

<dialog id="ticketDlg" aria-label="Ticket"><div class="dlg" id="ticketBody"></div></dialog>
<dialog id="newDlg" aria-label="New ticket"><div class="dlg" id="newBody"></div></dialog>
<dialog id="finishDlg" aria-label="Finish the ticket" style="width:min(480px, calc(100vw - 24px))"><div class="dlg" id="finishBody"></div></dialog>
<dialog id="subsDlg" aria-label="Unfinished sub-tickets" style="width:min(520px, calc(100vw - 24px))"><div class="dlg" id="subsBody"></div></dialog>
<div id="toast" role="status"></div>

<script>
"use strict";
const STAGES = ["backlog", "planning", "queued", "running", "review", "testing", "done"];
const STAGE_NAME = { backlog: "Backlog", planning: "Planning", queued: "Queued", running: "Running", review: "Review", testing: "Testing", done: "Done" };
const FLAG_NAME = { input: "Needs input", question: "Question", review: "Ready for review", testing: "Needs testing", ended: "Session ended", "start-failed": "Didn't start", conflict: "Conflicts" };
const STATUS_NAME = { busy: "Working", waiting: "Waiting on you", blocked: "Waiting on you", idle: "Idle", shell: "Idle · background task", starting: "Starting", gone: "Session ended", unknown: "Unknown" };

const store = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch { return null; } };
const state = {
  data: null, view: store("cl-view") || "board", filter: "all", project: "", subs: store("cl-subs") === "1",
  search: "", needsOpen: store("cl-needs") !== "0", open: null, detail: null, tab: null, picks: {}, other: {}, checks: {},
  sending: false,
};

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ago = (t) => { if (!t) return ""; const d = Math.max(0, (state.data?.now || Date.now() / 1000) - t);
  return d < 60 ? "now" : d < 3600 ? Math.floor(d / 60) + "m" : d < 86400 ? Math.floor(d / 3600) + "h" : Math.floor(d / 86400) + "d"; };
const toast = (msg, err) => { const el = document.getElementById("toast"); el.textContent = msg; el.className = err ? "err" : ""; el.style.display = "block";
  clearTimeout(toast.t); toast.t = setTimeout(() => (el.style.display = "none"), 3500); };

async function api(path, body) {
  const opts = body === undefined ? {} : { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) };
  const r = await fetch("/api/" + path, opts);
  if (r.status === 401) { location.href = "/"; throw new Error("log in"); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
async function act(key, action, body, msg) {
  try { const r = await api(`ticket/${encodeURIComponent(key)}/${action}`, body || {}); if (msg) toast(msg); await refresh(); return r; }
  catch (e) { toast(e.message, true); throw e; }
}
// The server answers once Claude has taken the answer (a few seconds at
// most), so the button says it's sending until then; after that the popup
// has done its job and closes.
async function sendAnswer(key, answers, btn) {
  if (state.sending) return;
  const was = btn.innerHTML; btn.disabled = true; btn.textContent = "Sending…"; state.sending = true;
  try { await act(key, "answer", { answers }, "Claude got your answer"); }
  catch { btn.disabled = false; btn.innerHTML = was; return; }
  finally { state.sending = false; }
  if (state.open === key) document.getElementById("ticketDlg").close();
}

const flagDetail = (f) => { try { return JSON.parse(f.detail); } catch { return null; } };
// The human is holding it up: it has a flag and Claude isn't working on it.
const needsMe = (row) => row.ticket.flags.length > 0 && row.ticket.stage !== "done" && !row.working;
const asks = (t) => t.flags.filter((f) => f.kind !== "testing" || t.stage === "testing");
function askText(t, f) {
  const d = flagDetail(f);
  if (f.kind === "question") return d?.questions?.map((q) => q.question).join(" · ") || "Claude asked something";
  if (f.kind === "input") return d ? `${d.tool || "Permission"}: ${d.summary || "wants permission"}` : (f.detail || "Waiting on a prompt");
  if (f.kind === "review") return (d === null && f.detail === "plan") || f.detail === "plan" ? "The plan is ready for approval" : (t.summary || "Claude says it's done");
  if (f.kind === "testing") return "Ready to try";
  if (f.kind === "conflict") return "Merging it back conflicts in: " + f.detail.split("\n").map((l) => l.trim().split(/\s+/)[0]).join(", ");
  return f.detail || FLAG_NAME[f.kind] || f.kind;
}
const flagLabel = (f) => f.kind === "review" && f.detail === "plan" ? "Plan ready" : (FLAG_NAME[f.kind] || f.kind);
const flagClass = (k) => ["input", "question", "review", "testing", "conflict"].includes(k) ? "f-" + k : "";
// Finishing: Claude is merging the branch or opening a PR before it goes to Done.
const finishPill = (t) => t.finishing ? `<span class="pill f-finishing" title="${t.finishing === "pr" ? "Claude is opening a PR" : "Claude is merging its branch"}; it goes to Done after">Finishing</span>` : "";
const pills = (t) => t.flags.length || t.finishing ? `<span class="pills">${finishPill(t)}${t.flags.map((f) => `<span class="pill ${flagClass(f.kind)}">${esc(flagLabel(f))}</span>`).join("")}</span>` : "";
// "(starting)" is the dispatcher's claim while it opens the session.
// A Backlog or Queued ticket whose session is gone hasn't ended: it's waiting to start.
const statusOf = (row) => row.status || (row.ticket.tmux.startsWith("(") ? "starting" : row.ticket.tmux && !["backlog", "queued"].includes(row.ticket.stage) ? "gone" : "none");
const statusHtml = (row) => { const s = statusOf(row); const label = s === "none" ? (row.ticket.stage === "queued" ? "Waiting for a slot" : "Not started") : (STATUS_NAME[s] || s);
  return `<span class="status"><span class="dot s-${esc(s)}"></span>${esc(label)}</span>`; };
const where = (t) => t.worktree || t.branch ? t.branch || "worktree" : t.mode === "worktree" ? "worktree on start" : t.target ? "queue: " + t.target : "queue";

// ---- board data ----
// Redraws from the 3-second refresh must not move anything: each scrolled
// element under root (found again by its child-index path) and the page keep
// their scroll, and a focused control keeps focus.
function pathTo(root, el) { const p = []; for (; el !== root; el = el.parentElement) p.unshift([...el.parentElement.children].indexOf(el)); return p; }
const atPath = (root, p) => p.reduce((el, i) => el?.children[i], root);
function keepScroll(root, draw) {
  const saved = [root, ...root.querySelectorAll("*")].filter((el) => el.scrollLeft || el.scrollTop)
    .map((el) => [pathTo(root, el), el.scrollLeft, el.scrollTop]);
  const page = [scrollX, scrollY]; const a = document.activeElement;
  const focus = a && a !== root && root.contains(a) ? pathTo(root, a) : null;
  draw();
  for (const [p, l, t] of saved) { const el = atPath(root, p); if (el) { el.scrollLeft = l; el.scrollTop = t; } }
  if (focus) atPath(root, focus)?.focus({ preventScroll: true });
  scrollTo(page[0], page[1]);
}
// Set el's HTML, leaving it alone when nothing changed.
function setHtml(el, html) {
  if (el.drawn === html) return;
  keepScroll(el, () => { el.innerHTML = html; });
  el.drawn = html;
}
async function refresh() {
  try { state.data = await api("board"); } catch (e) { if (e.message !== "log in") toast(e.message, true); return; }
  if (!drag) render();
  if (state.open) loadDetail(state.open, true);
}
function visible() {
  const q = state.search.toLowerCase();
  return state.data.tickets.filter((row) => {
    const t = row.ticket;
    if (!state.subs && t.parent) return false;
    if (state.project && t.project !== state.project) return false;
    if (q && !(t.key + " " + t.title + " " + t.body).toLowerCase().includes(q)) return false;
    const f = state.filter;
    if (f === "all") return true;
    if (f === "me") return needsMe(row);
    if (f === "working") return row.status === "busy";
    return t.flags.some((x) => x.kind === f);
  });
}

function render() {
  const d = state.data; if (!d) return;
  const live = d.tickets.filter((r) => r.status && r.status !== "gone").length;
  document.getElementById("summary").textContent = `${d.tickets.length} tickets · ${live} sessions live`;
  for (const b of document.querySelectorAll("[data-view]")) b.classList.toggle("on", b.dataset.view === state.view);
  renderNeeds(); renderFilters();
  const main = document.getElementById("main");
  if (!d.projects.length) {
    setHtml(main, `<p class="empty">No projects yet. Add one with <span class="mono">cl project add &lt;name&gt; &lt;dir&gt;</span>, or with New ticket.</p>`); return;
  }
  const rows = visible();
  setHtml(main, state.view === "lanes" ? lanesHtml(rows) : state.view === "list" ? listHtml(rows) : boardHtml(rows));
}

function renderNeeds() {
  const rows = state.data.tickets.filter(needsMe);
  rows.sort((a, b) => Math.min(...a.ticket.flags.map((f) => f.at)) - Math.min(...b.ticket.flags.map((f) => f.at)));
  const box = document.getElementById("needs");
  box.style.display = rows.length ? "" : "none";
  box.classList.toggle("closed", !state.needsOpen);

      <div class="actions"><button type="submit" class="btn primary">Create</button></div></form>`;
  const form = document.getElementById("newForm");
  for (const k of NEW_KEEP) {
    const el = form.elements[k], v = last[k];
    // The queue session belongs to the last ticket's project; don't carry it to another.
    if (!el || v == null || (k === "target" && proj !== last.project)) continue;
    if (el.tagName === "SELECT" && ![...el.options].some((o) => o.value === v)) continue;
    el.value = v;
  }
  document.getElementById("newDlg").showModal();
}
async function submitNew(form) {
  const f = Object.fromEntries(new FormData(form));
  try {
    if (f.pname) { await api("project", { name: f.pname, dir: f.pdir, mode: f.mode }); f.project = f.pname; }
    const r = await api("ticket", { project: f.project, title: f.title, body: f.body, mode: f.mode, target: f.target || undefined,
      stage: f.when, plan: f.when === "planning", skill: f.skill || undefined, profile: f.profile || undefined, parent: f.parent || undefined });
    store("cl-new", JSON.stringify({ project: f.project, ...Object.fromEntries(NEW_KEEP.map((k) => [k, f[k] ?? ""])) }));
    document.getElementById("newDlg").close(); toast(`${r.key} created`); await refresh();
  } catch (e) { toast(e.message, true); }
}

// ---- drag a card to another column, or up and down for priority ----
// Pointer events rather than HTML5 drag and drop, so it works on touch and on
// <button> cards. A mouse picks a card up once it moves; a finger has to hold
// still for a moment first, so a swipe still scrolls the board.
let drag = null, dragDone = 0;
function dropAt(x, y) {
  const el = document.elementFromPoint(x, y)?.closest("[data-drop]");
  if (!el || (el.dataset.project && el.dataset.project !== drag.project)) return null;
  return el;
}
function liftCard() {
  const r = drag.el.getBoundingClientRect();
  const g = drag.el.cloneNode(true); g.id = "ghost"; g.removeAttribute("data-drag");
  Object.assign(g.style, { width: r.width + "px", left: r.left + "px", top: r.top + "px" });
  document.body.appendChild(g);
  drag.ghost = g; drag.dx = drag.x - r.left; drag.dy = drag.y - r.top;
  drag.home = drag.el.closest("[data-drop]");
  drag.at = [...drag.home.querySelectorAll("[data-drag]")].indexOf(drag.el);
  drag.el.classList.add("lifted");
  drag.scroller = drag.el.closest(".cols, .lanes");
  navigator.vibrate?.(10);
}
function dragMove(x, y) {
  drag.lx = x; drag.ly = y;
  drag.ghost.style.left = x - drag.dx + "px"; drag.ghost.style.top = y - drag.dy + "px";
  const el = dropAt(x, y);
  if (el !== drag.over) { drag.over?.classList.remove("drop-on"); el?.classList.add("drop-on"); drag.over = el; }
  let s = el && slotAt(el, y);
  if (s && el === drag.home && s.i === drag.at) s = null; // where it already is
  if (s?.above !== drag.slot?.above || s?.below !== drag.slot?.below) { showSlot(drag.slot, false); showSlot(s, true); }
  drag.slot = s;
}
// Where in a column a drop at height y lands: between the cards above and
// below it (either may be null), at index i among the column's other cards.
// Done has no order of its own.
function slotAt(el, y) {
  if (el.dataset.drop === "done") return null;
  const cards = [...el.querySelectorAll("[data-drag]")].filter((c) => c !== drag.el);
  let i = cards.findIndex((c) => { const r = c.getBoundingClientRect(); return y < r.top + r.height / 2; });
  if (i < 0) i = cards.length;
  return { above: cards[i - 1] || null, below: cards[i] || null, i };
}
function showSlot(s, on) {
  if (s?.below) s.below.classList.toggle("ins-above", on); else s?.above?.classList.toggle("ins-below", on);
}
function autoScroll() {
  if (!drag?.ghost) return;
  const sc = drag.scroller, edge = 48;
  if (sc) { const r = sc.getBoundingClientRect();
    if (drag.lx < r.left + edge) sc.scrollLeft -= 14; else if (drag.lx > r.right - edge) sc.scrollLeft += 14; }
  if (drag.ly < edge) scrollBy(0, -14); else if (drag.ly > innerHeight - edge) scrollBy(0, 14);
  dragMove(drag.lx, drag.ly);
  drag.raf = requestAnimationFrame(autoScroll);
}
function endDrag(drop) {
  const d = drag; drag = null; if (!d) return;
  clearTimeout(d.hold); cancelAnimationFrame(d.raf);
  d.ghost?.remove(); d.over?.classList.remove("drop-on"); d.el.classList.remove("lifted"); showSlot(d.slot, false);
  if (!d.ghost) return;
  dragDone = Date.now();
  const stage = drop && d.over?.dataset.drop;
  if (!stage) return render();
  // The ticket it goes after, or before when it goes to the top.
  const s = d.slot;
  const place = s?.above ? { after: s.above.dataset.drag } : s?.below ? { before: s.below.dataset.drag } : {};
  if (d.over !== d.home) return moveTo(d.key, stage, place);
  if (!s) return render();
  placeLocally(d.key, place); render();
  act(d.key, "rank", place).catch(() => refresh());
}
// Show a reorder before the server answers: just past its new neighbor.
function placeLocally(key, place) {
  const rank = (k) => state.data.tickets.find((r) => r.ticket.key === k)?.ticket.rank;
  const t = state.data.tickets.find((r) => r.ticket.key === key)?.ticket; if (!t) return;
  if (place.after) t.rank = rank(place.after) + 0.5; else if (place.before) t.rank = rank(place.before) - 0.5;
}

// ---- moving to Done ----
// A ticket can't be Done while it has unfinished sub-tickets: offer to spin
// them off into tickets of their own first. Resolves to the extra request
// fields ({} or { spin_off: true }), or null when cancelled.
const openSubs = (key) => state.data.tickets.filter((r) => r.ticket.parent === key && r.ticket.stage !== "done");
function confirmDone(key) {
  const subs = openSubs(key);
  if (!subs.length) return Promise.resolve({});
  const dlg = document.getElementById("subsDlg");
  document.getElementById("subsBody").innerHTML = `<h2 style="margin:0;font-size:17px">${esc(key)} can't be done yet</h2>
    <p class="muted" style="margin:0">It has ${subs.length} sub-ticket${subs.length > 1 ? "s" : ""} that ${subs.length > 1 ? "aren't" : "isn't"} done:</p>
    <div style="display:flex;flex-direction:column;gap:6px">${subs.map((r) => `<div><span class="mono muted">${esc(r.ticket.key)}</span> ${esc(r.ticket.title)}
      <span class="muted">· ${STAGE_NAME[r.ticket.stage]}</span></div>`).join("")}</div>
    <p class="muted" style="margin:0">Spinning them off makes them tickets of their own. They keep their stage and session, and ${esc(key)} goes to Done.</p>
    <div class="actions"><button type="button" class="btn primary" id="spinOff">Spin off and finish</button><button type="button" class="btn" id="spinCancel">Cancel</button></div>`;
  dlg.returnValue = ""; dlg.showModal();
  return new Promise((res) => { dlg.onclose = () => res(dlg.returnValue === "spin" ? { spin_off: true } : null); });
}
// Then, for a ticket with a branch of its own, what finishing means: Claude
// merges it or opens a PR first ("merge", "pr"), or it just closes.
// Resolves to "close", "merge", "pr", or null when cancelled.
async function chooseFinish(key) {
  const t = state.data.tickets.find((r) => r.ticket.key === key)?.ticket || (state.detail?.ticket.key === key ? state.detail.ticket : null);
  if (!t?.branch && !t?.change) return "close";
  let main = state.detail?.ticket.key === key ? state.detail.main_branch : "";
  if (!main) main = (await api(`ticket/${encodeURIComponent(key)}`).catch(() => ({}))).main_branch || "master";
  const dlg = document.getElementById("finishDlg");
  document.getElementById("finishBody").innerHTML = `<h2 style="margin:0;font-size:17px">Finish ${esc(key)}</h2>
    <p class="muted" style="margin:0">Its work is on <span class="mono">${esc(t.branch || "its jj change " + t.change.slice(0, 12))}</span>. What should happen to it?</p>
    <div style="display:flex;flex-direction:column;gap:8px">
      <button type="button" class="btn primary" data-finish="merge">Merge into ${esc(main)}</button>
      <button type="button" class="btn" data-finish="pr">Open a PR</button>
      <button type="button" class="btn" data-finish="close">Just close</button>
      <button type="button" class="btn" data-finish="">Cancel</button></div>
    <p class="muted" style="margin:0;font-size:12.5px">${t.change ? "Merge: cl rebases its jj change onto " + esc(main) + " and moves " + esc(main) + " to it; Claude settles any conflicts and restarts what runs from the checkout. PR: Claude pushes it and opens the PR." : "Merge and PR ask Claude to do it in the ticket's session."} It stays where it is, marked Finishing, until Claude is through; then it goes to Done and the session closes.</p>`;
  dlg.returnValue = ""; dlg.showModal();
  return new Promise((res) => { dlg.onclose = () => res(dlg.returnValue || null); });
}
// Everything going to Done asks: sub-tickets first, then how to finish.
// The extra request fields, or null when cancelled.
async function doneExtras(key) {
  const extra = await confirmDone(key); if (!extra) return null;
  const finish = await chooseFinish(key); if (!finish) return null;
  return { ...extra, finish };
}
const finishMsg = (key, x) => x.finish === "pr" ? `${key}: Claude is opening a PR` : x.finish === "merge" ? `${key}: Claude is merging it` : "";
async function moveTo(key, stage, place = {}) {
  const row = state.data.tickets.find((r) => r.ticket.key === key);
  if (!row || row.ticket.stage === stage) return render();
  const extra = stage === "done" ? await doneExtras(key) : {};
  if (!extra) { render(); if (state.detail) renderDetail(); return; }
  // Merge or PR: it stays put (Finishing) until Claude is done.
  if (finishMsg(key, extra)) { render(); return act(key, "move", { stage, ...extra }, finishMsg(key, extra)).catch(() => refresh()); }
  row.ticket.stage = stage; placeLocally(key, place); render();
  const n = extra.spin_off ? openSubs(key).length : 0;
  act(key, "move", { stage, ...extra, ...place }, `${key} to ${STAGE_NAME[stage]}${n ? ` · ${n} spun off` : ""}`).catch(() => refresh());
}
document.addEventListener("pointerdown", (e) => {
  const el = e.target.closest("[data-drag]");
  if (!el || !el.closest("#main") || drag || (e.pointerType === "mouse" && e.button !== 0)) return;
  const row = state.data?.tickets.find((r) => r.ticket.key === el.dataset.drag);
  drag = { el, key: el.dataset.drag, project: row?.ticket.project, id: e.pointerId, touch: e.pointerType !== "mouse", x: e.clientX, y: e.clientY };
  if (drag.touch) drag.hold = setTimeout(() => { if (drag && !drag.ghost) { liftCard(); dragMove(drag.x, drag.y); autoScroll(); } }, 350);
});
document.addEventListener("pointermove", (e) => {
  if (!drag || e.pointerId !== drag.id) return;
  if (drag.ghost) { e.preventDefault(); dragMove(e.clientX, e.clientY); return; }
  const far = Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > (drag.touch ? 10 : 6);
  if (!far) return;
  if (drag.touch) { endDrag(false); return; } // moved before the hold: it's a scroll
  liftCard(); dragMove(e.clientX, e.clientY); autoScroll();
});
document.addEventListener("pointerup", (e) => { if (drag && e.pointerId === drag.id) endDrag(true); });
document.addEventListener("pointercancel", (e) => { if (drag && e.pointerId === drag.id) endDrag(false); });
// Once a finger has picked a card up, keep the page from scrolling under it.
document.addEventListener("touchmove", (e) => { if (drag?.ghost) e.preventDefault(); }, { passive: false });
document.addEventListener("contextmenu", (e) => { if (drag) e.preventDefault(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && drag) endDrag(false); });
// A drop ends with a click on the card; don't let it open the ticket.
document.addEventListener("click", (e) => { if (Date.now() - dragDone < 400 && e.target.closest("[data-drag]")) { e.stopPropagation(); e.preventDefault(); } }, true);

// ---- events ----
document.addEventListener("click", async (e) => {
  const el = e.target.closest("button, a, tr.row"); if (!el) return;
  const ds = el.dataset;
  if (ds.view) { state.view = ds.view; store("cl-view", ds.view); render(); return; }
  if (ds.filter) { state.filter = ds.filter; render(); return; }
  if (el.id === "subsBtn") { state.subs = !state.subs; store("cl-subs", state.subs ? "1" : "0"); render(); return; }
  if (el.id === "needsToggle") { state.needsOpen = !state.needsOpen; store("cl-needs", state.needsOpen ? "1" : "0"); renderNeeds(); return; }
  if (el.id === "newBtn") return openNew(null);
  if (el.id === "closeNew") return document.getElementById("newDlg").close();
  if (el.id === "closeDlg") { document.getElementById("ticketDlg").close(); return; }
  if (ds.finish !== undefined) { document.getElementById("finishDlg").close(ds.finish); return; }
  if (el.id === "spinOff" || el.id === "spinCancel") { document.getElementById("subsDlg").close(el.id === "spinOff" ? "spin" : ""); return; }
  if (ds.answer) { e.stopPropagation(); return sendAnswer(ds.answer, [ds.n], el); }
  if (ds.approve) {
    const extra = state.data.tickets.find((r) => r.ticket.key === ds.approve)?.ticket.stage === "testing" ? await doneExtras(ds.approve) : {};
    if (!extra) return;
    return act(ds.approve, "approve", extra, finishMsg(ds.approve, extra) || "Approved");
  }
  if (ds.open) return openTicket(ds.open, ds.tab);
  const key = state.open; if (!key) return;
  if (ds.tab) { state.tab = ds.tab; renderDetail(); return; }
  if (ds.key) return act(key, "key", { key: ds.key });
  if (ds.move) return act(key, "move", { stage: ds.move }, "Moved");
  if (ds.pick !== undefined) { state.picks[ds.pick] = ds.n; state.other[ds.pick] = ""; renderDetail(); return; }
  if (ds.perm) return sendAnswer(key, [ds.perm], el);
  if (ds.check !== undefined) { const c = state.checks["c" + ds.check] || {}; c.pass = ds.pass === "1"; state.checks["c" + ds.check] = c; renderDetail(); return; }
  if (ds.act === "gutter") {
    const w = window.open("", "_blank");
    try { const r = await act(key, "gutter"); const url = `http://${location.hostname}:${r.port}/`; if (w) w.location = url; else location.href = url; }
    catch { if (w) w.close(); }
    return;
  }
  if (ds.act === "start") return act(key, "start", {}, "Started");
  if (ds.act === "approve" && state.detail?.ticket.stage === "testing") {
    const extra = await doneExtras(key); if (!extra) return;
    return act(key, "approve", extra, finishMsg(key, extra) || "Done");
  }
  if (ds.act) return act(key, ds.act, {}, "Done");
  if (el.id === "sendAnswers") {
    const qs = flagDetail(state.detail.ticket.flags.find((f) => f.kind === "question"))?.questions || [];
    const answers = qs.map((_, i) => (state.other[i] || "").trim() || state.picks[i]);
    if (answers.some((x) => !x)) return toast("Answer every question first", true);
    return sendAnswer(key, answers, el);
  }
  if (el.id === "sendMsg" || el.id === "saveNote" || el.id === "saveSend" || el.id === "sendBack") {
    const box = document.getElementById(el.id === "sendMsg" ? "msg" : el.id === "sendBack" ? "backText" : "commentText");
    const text = box.value.trim(); if (!text) return;
    const r = await act(key, "comment", { text, send: el.id !== "saveNote" });
    box.value = ""; toast(r.sent_back ? `Back to Claude: round ${r.round}` : r.sent ? "Sent" : r.unsent ? "Saved (no session yet)" : "Saved");
    return;
  }
  if (el.id === "sendResults") {
    const p = state.detail.test_plan;
    const checks = p.checks.map((text, i) => ({ text, pass: state.checks["c" + i]?.pass, note: state.checks["c" + i]?.note || "" }));
    if (checks.some((c) => c.pass === undefined)) return toast("Pass or fail every check first", true);
    const extra = checks.every((c) => c.pass) && state.detail.ticket.stage === "testing" ? await doneExtras(key) : {};
    if (!extra) return;
    const r = await act(key, "test-results", { checks, note: document.getElementById("testNote").value, ...extra });
    toast(r.passed ? (finishMsg(key, extra) ? "All passed: " + finishMsg(key, extra) : "All passed: done") : "Sent the failures to Claude"); state.checks = {};
    return;
  }
  if (el.id === "deleteTicket") {
    if (el.dataset.sure !== "1") { el.dataset.sure = "1"; el.textContent = "Really delete?"; return; }
    await act(key, "rm", {}, "Deleted"); document.getElementById("ticketDlg").close(); return;
  }
});
document.addEventListener("input", (e) => {
  const ds = e.target.dataset;
  if (ds.other !== undefined) { state.other[ds.other] = e.target.value; }
  if (ds.note !== undefined) { const c = state.checks["c" + ds.note] || {}; c.note = e.target.value; state.checks["c" + ds.note] = c; }
  if (ds.setup !== undefined) state.checks["s" + ds.setup] = e.target.checked;
  if (e.target.id === "testNote") state.checks.note = e.target.value;
  if (e.target.id === "search") { state.search = e.target.value; render(); }
});
document.addEventListener("change", (e) => {
  if (e.target.id === "projectSel") { state.project = e.target.value; render(); }
  if (e.target.id === "stageSel" && state.open) moveTo(state.open, e.target.value);
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && e.target.id === "msg") { e.preventDefault(); document.getElementById("sendMsg").click(); }
});
document.addEventListener("submit", async (e) => {
  e.preventDefault();
  if (e.target.id === "newForm") return submitNew(e.target);
  if (e.target.id === "editForm") {
    const f = Object.fromEntries(new FormData(e.target));
    await act(state.open, "edit", { title: f.title, body: f.body, project: f.project, mode: f.mode, target: f.target, plan: f.plan === "1", skill: f.skill }, "Saved");
    if (e.submitter?.value === "close") document.getElementById("ticketDlg").close();
  }
});
document.getElementById("ticketDlg").addEventListener("close", () => { state.open = null; state.detail = null; });

refresh();
setInterval(() => { if (!document.hidden) refresh(); }, 3000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
</script>
</body>
</html>
