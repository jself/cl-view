<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<meta name="color-scheme" content="dark">
<title>cl board</title>
<link rel="stylesheet" href="/xterm.css">
<script>
  // Everything on the board is sized in --u, one scaled pixel, so the whole
  // page scales like browser zoom: by web.font_size from the config (in
  // --font, set by the server; 14 is the unscaled size) times this browser's
  // Ctrl+= / Ctrl+- zoom.
  try { document.documentElement.style.setProperty("--zoom", localStorage.getItem("cl-board-zoom") || 1); } catch {}
</script>
<style>
  :root {
    --u: calc(1px * var(--font, 14) / 14 * var(--zoom, 1));
    --bg: #111214; --panel: #16171a; --card: #1f2024; --line: #2c2e33; --line2: #24262a;
    --fg: #ececec; --muted: #a0a3a8; --dim: #b4b6ba; --accent: #2a4f86; --accent-fg: #fff;
    --input: #ffc861; --input-bg: #3a2a0b; --question: #cdb8ff; --question-bg: #2c2440;
    --review: #9cc6ff; --review-bg: #11294a; --testing: #7ee6d6; --testing-bg: #0f3330;
    --other: #d6d7da; --other-bg: #2c2e33; --finishing: #b6e3a0; --finishing-bg: #1b3317;
    --conflict: #ffb4b4; --conflict-bg: #3d1a1a;
    --mono: ui-monospace, SFMono-Regular, Menlo, "DejaVu Sans Mono", monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: calc(14 * var(--u))/1.4 var(--sans); }
  body { overflow-x: clip; } /* wide content scrolls inside its own box (board columns, tables); the page never pans sideways */
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: #8fbcff; }
  .mono { font-family: var(--mono); }
  .muted { color: var(--muted); }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: calc(10 * var(--u)); padding: calc(12 * var(--u)) calc(16 * var(--u)); border-bottom: 1px solid var(--line2); }
  header .title { font: 500 calc(17 * var(--u)) var(--mono); }
  header .grow { flex: 1 1 calc(40 * var(--u)); }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: calc(6 * var(--u)); min-height: calc(36 * var(--u)); padding: 0 calc(12 * var(--u));
         border-radius: calc(8 * var(--u)); border: 1px solid var(--line); background: #26282d; color: #e6e7e9; cursor: pointer; text-decoration: none; white-space: nowrap; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  .btn.danger { border-color: #6b2b2b; color: #ffb4b4; }
  .btn:disabled { opacity: .5; cursor: default; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: calc(10 * var(--u)); overflow: hidden; }
  .seg button { min-height: calc(36 * var(--u)); padding: 0 calc(12 * var(--u)); border: 0; background: #18191c; color: #c4c6ca; cursor: pointer; }
  .seg button.on { background: var(--line); color: #fff; }
  input[type=search], input[type=text], select, textarea {
    min-height: calc(36 * var(--u)); padding: calc(6 * var(--u)) calc(10 * var(--u)); border: 1px solid var(--line); border-radius: calc(8 * var(--u)); background: #18191c; }
  textarea { width: 100%; resize: vertical; }
  #search { min-width: 0; flex: 0 1 calc(280 * var(--u)); margin-left: auto; }

  #needs { margin: calc(12 * var(--u)) calc(16 * var(--u)) 0; border: 1px solid #3a2f1a; background: #17150f; border-radius: calc(14 * var(--u)); }
  #needs > .nhd { display: flex; align-items: center; }
  #needsToggle { flex: 1; display: flex; align-items: center; gap: calc(10 * var(--u)); width: 100%; min-height: calc(46 * var(--u)); padding: 0 calc(14 * var(--u)); border: 0;

  #needs .count { font-family: var(--mono); color: var(--input); }
  #needsToggle > span:first-child { white-space: nowrap; }

  .ask.hidden { opacity: .6; }

  #needs .strip { display: flex; gap: calc(12 * var(--u)); overflow-x: auto; padding: 0 calc(14 * var(--u)) calc(14 * var(--u)); scroll-snap-type: x mandatory; }
  #needs.closed .strip { display: none; }

               display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden; }
  .ask .acts { display: flex; flex-wrap: wrap; gap: calc(6 * var(--u)); margin-top: auto; }

  nav#filters { display: flex; flex-wrap: wrap; align-items: center; gap: calc(8 * var(--u)); padding: calc(12 * var(--u)) calc(16 * var(--u)); }
  nav#filters select { min-height: calc(34 * var(--u)); }
  .switch { position: relative; display: inline-flex; align-items: center; gap: calc(8 * var(--u)); min-height: calc(34 * var(--u)); padding: 0 calc(4 * var(--u));
            cursor: pointer; white-space: nowrap; flex: none; color: #d6d7da; user-select: none; }
  .switch input { position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; }

  .switch .track::after { content: ""; position: absolute; top: calc(2 * var(--u)); left: calc(2 * var(--u)); width: calc(16 * var(--u)); height: calc(16 * var(--u));
                          border-radius: 50%; background: #c4c6ca; transition: transform .15s, background .15s; }
  .switch input:checked + .track { background: var(--accent); }

  .switch input:focus-visible + .track { outline: 2px solid #8fbcff; outline-offset: 2px; }
  .switch .n { font: calc(12 * var(--u)) var(--mono); color: var(--muted); }

  main { padding: 0 calc(16 * var(--u)) calc(32 * var(--u)); }
  .cols { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(calc(230 * var(--u)), 1fr); gap: calc(12 * var(--u)); overflow-x: auto;
          align-items: start; scroll-snap-type: x mandatory; padding-bottom: calc(8 * var(--u)); }
  .col { background: var(--panel); border: 1px solid #222428; border-radius: calc(12 * var(--u)); padding: calc(10 * var(--u)); display: flex; flex-direction: column;
         gap: calc(8 * var(--u)); min-height: calc(160 * var(--u)); scroll-snap-align: start; }
  .col h2 { margin: 0; font-size: calc(13 * var(--u)); font-weight: 600; display: flex; gap: calc(8 * var(--u)); align-items: center; padding: calc(2 * var(--u)) calc(4 * var(--u)); }
  .col h2 .n { font: calc(12 * var(--u)) var(--mono); color: var(--muted); }
  .add { width: 100%; min-height: calc(34 * var(--u)); border: 1px dashed var(--line); border-radius: calc(10 * var(--u)); background: none;
         color: var(--muted); font-size: calc(18 * var(--u)); line-height: 1; cursor: pointer; }
  .add:hover { color: var(--fg); border-color: var(--muted); background: #18191c; }
  .card { width: 100%; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: calc(10 * var(--u)); padding: calc(11 * var(--u));
          display: flex; flex-direction: column; gap: calc(6 * var(--u)); cursor: pointer; color: var(--fg); }
  .card.hot { border-color: #f5a524; }
  /* The key and title sit on a band tinted by the session's status. */
  .card .hd { display: flex; flex-direction: column; gap: calc(6 * var(--u)); margin: calc(-11 * var(--u)) calc(-11 * var(--u)) 0; padding: calc(11 * var(--u)) calc(11 * var(--u)) calc(9 * var(--u));
              border-radius: calc(9 * var(--u)) calc(9 * var(--u)) 0 0; background: linear-gradient(100deg, color-mix(in srgb, var(--sbg, transparent) 24%, transparent), color-mix(in srgb, var(--sbg, transparent) 6%, transparent)); }
  .card .top { display: flex; gap: calc(8 * var(--u)); font: calc(11.5 * var(--u)) var(--mono); color: var(--muted); }
  .card .top .grow { flex: 1; }
  /* The shell icon on a card or list row: straight to the session's terminal. */
  .shell-ic { display: inline-flex; align-items: center; justify-content: center; width: calc(22 * var(--u)); height: calc(18 * var(--u)); margin: calc(-2 * var(--u)) 0;
              border-radius: calc(5 * var(--u)); color: #2dd4bf; cursor: pointer; flex: none; vertical-align: middle; }
  .shell-ic:hover { background: #22303a; }
  .shell-ic svg { width: calc(15 * var(--u)); height: calc(15 * var(--u)); }
  .card .t { font-size: calc(14 * var(--u)); font-weight: 500; line-height: 1.35; }
  .card .meta { font: calc(11.5 * var(--u)) var(--mono); color: var(--dim); overflow-wrap: anywhere; }
  .card .sub { font: calc(11.5 * var(--u)) var(--mono); color: var(--question); }
  .card[data-drag] { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  .card.lifted { opacity: .35; }
  #ghost { position: fixed; z-index: 20; pointer-events: none; margin: 0; box-shadow: 0 calc(12 * var(--u)) calc(32 * var(--u)) rgba(0,0,0,.55); transform: rotate(1.5deg); opacity: .95; }
  .drop-on { outline: calc(2 * var(--u)) dashed #60a5fa; outline-offset: calc(-2 * var(--u)); background: #16202e; }
  .lanes td.drop-on { border-radius: calc(10 * var(--u)); }
  /* Where a dragged card would land in its column: a line in the gap between cards. */
  .card { position: relative; }
  .card.ins-above::before, .card.ins-below::after { content: ""; position: absolute; left: calc(4 * var(--u)); right: calc(4 * var(--u)); height: calc(3 * var(--u)); border-radius: calc(2 * var(--u));
    background: #60a5fa; pointer-events: none; z-index: 21; box-shadow: 0 0 0 1px #0b0b0c; } /* over the ghost */
  .card.ins-above::before { top: calc(-6 * var(--u)); } .card.ins-below::after { bottom: calc(-6 * var(--u)); }
  .lanes .card.ins-above::before { top: calc(-5 * var(--u)); } .lanes .card.ins-below::after { bottom: calc(-5 * var(--u)); }
  /* Session status colors, the same hues as `cl list`: --sc for the label and dot, --sbg tints a card's title band, stronger on the left and faint on the right. */
  .s-busy { --sc: #facc15; --sbg: var(--sc); } .s-waiting { --sc: #e879f9; --sbg: var(--sc); } .s-blocked { --sc: #f87171; --sbg: var(--sc); }
  .s-idle { --sc: #4ade80; --sbg: var(--sc); } .s-shell { --sc: #22d3ee; --sbg: var(--sc); } .s-starting { --sc: #60a5fa; --sbg: var(--sc); }
  .s-gone, .s-killed { --sc: #8b8e94; --sbg: var(--sc); } .s-unknown, .s-none { --sc: #a0a3a8; }
  .status { display: inline-flex; align-items: center; gap: calc(7 * var(--u)); font-size: calc(12.5 * var(--u)); color: var(--sc, #d6d7da); }
  .status.s-none { color: #d6d7da; }
  .dot { width: calc(8 * var(--u)); height: calc(8 * var(--u)); border-radius: calc(4 * var(--u)); flex: none; display: inline-block; background: var(--sc, #5d6168); }
  .s-none .dot { background: transparent; border: 1px solid #5d6168; }
  .pills { display: flex; flex-wrap: wrap; gap: calc(5 * var(--u)); }
  .pill { display: inline-flex; align-items: center; height: calc(22 * var(--u)); padding: 0 calc(8 * var(--u)); border-radius: calc(11 * var(--u)); font-size: calc(11.5 * var(--u));
          background: var(--other-bg); color: var(--other); white-space: nowrap; }
  .f-input { background: var(--input-bg); color: var(--input); } .f-question { background: var(--question-bg); color: var(--question); }
  .f-review { background: var(--review-bg); color: var(--review); } .f-testing { background: var(--testing-bg); color: var(--testing); }
  .f-conflict { background: var(--conflict-bg); color: var(--conflict); }
  .f-finishing { background: var(--finishing-bg); color: var(--finishing); }

  .lanes { overflow-x: auto; }
  .lanes table { border-collapse: separate; border-spacing: calc(8 * var(--u)) 0; min-width: calc(1100 * var(--u)); width: 100%; }
  .lanes th { text-align: left; font-size: calc(11.5 * var(--u)); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: calc(4 * var(--u)) 0; }
  .lanes td { vertical-align: top; padding: calc(10 * var(--u)) 0; border-top: 1px solid var(--line2); }
  .lanes td.lane { width: calc(150 * var(--u)); }
  .lanes td > div { display: flex; flex-direction: column; gap: calc(6 * var(--u)); }

  .list { overflow-x: auto; border: 1px solid var(--line2); border-radius: calc(12 * var(--u)); }
  .list table { border-collapse: collapse; width: 100%; min-width: calc(900 * var(--u)); }
  .list th { text-align: left; font-size: calc(11.5 * var(--u)); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted);
             background: #18191c; padding: calc(9 * var(--u)) calc(12 * var(--u)); }
  .list td { padding: calc(9 * var(--u)) calc(12 * var(--u)); border-top: 1px solid var(--line2); vertical-align: top; }
  .list tr.row { cursor: pointer; }
  .list tr.row:hover td { background: #17181b; }

  dialog { padding: 0; border: 1px solid var(--line); border-radius: calc(16 * var(--u)); background: #17181b; color: var(--fg);
           width: min(calc(900 * var(--u)), calc(100vw - calc(24 * var(--u)))); max-height: calc(100dvh - calc(40 * var(--u))); }
  dialog::backdrop { background: rgba(5, 5, 6, .66); }
  .dlg { padding: calc(18 * var(--u)) calc(20 * var(--u)) calc(20 * var(--u)); display: flex; flex-direction: column; gap: calc(12 * var(--u)); }
  .dlg .head { display: flex; flex-wrap: wrap; align-items: center; gap: calc(10 * var(--u)); }
  .dlg h1 { margin: 0; font-size: calc(21 * var(--u)); font-weight: 600; overflow-wrap: anywhere; }
  .dlg .facts { display: flex; flex-wrap: wrap; gap: calc(6 * var(--u)) calc(16 * var(--u)); font-size: calc(13 * var(--u)); color: var(--dim); }
  .dlg .actions { display: flex; flex-wrap: wrap; gap: calc(8 * var(--u)); }
  .tabs { display: flex; gap: calc(18 * var(--u)); border-bottom: 1px solid var(--line); overflow-x: auto; }
  .tabs button { min-height: calc(40 * var(--u)); padding: 0 calc(2 * var(--u)); border: 0; border-bottom: calc(2 * var(--u)) solid transparent; background: none; color: var(--muted); cursor: pointer; white-space: nowrap; }
  .tabs button.on { color: #fff; border-bottom-color: #7fb2ff; }
  pre.term { margin: 0; background: #0b0b0c; border: 1px solid var(--line2); border-radius: calc(10 * var(--u)); padding: calc(10 * var(--u)) calc(12 * var(--u)); font: calc(12 * var(--u))/1.5 var(--mono);
             white-space: pre-wrap; overflow-wrap: anywhere; max-height: 50vh; overflow-y: auto; }
  .tail { position: relative; }
  /* The session's screen at its own width: a wide pane scrolls sideways. */
  .tail .tailterm { height: 50vh; overflow-x: auto; overflow-y: hidden; background: #0b0b0c; border: 1px solid var(--line2);
                    border-radius: calc(10 * var(--u)); padding: calc(8 * var(--u)) 0 calc(8 * var(--u)) calc(10 * var(--u)); }
  .tail .tailterm .xterm { height: 100%; }
  .tail .tobottom { position: absolute; right: calc(14 * var(--u)); bottom: calc(10 * var(--u)); padding: calc(6 * var(--u)) calc(12 * var(--u));
                    border: 1px solid var(--line2); border-radius: 999px; background: rgba(40, 42, 48, .7); color: #fff; opacity: .75;
                    font-size: calc(12.5 * var(--u)); cursor: pointer; backdrop-filter: blur(2px); }
  .tail .tobottom:hover { opacity: 1; }
  .tail .tobottom[hidden] { display: none; }
  /* Opens the session in the full terminal view, like Open shell. */
  .tail .maximize { position: absolute; top: calc(8 * var(--u)); right: calc(18 * var(--u)); display: grid; place-items: center;
                    width: calc(30 * var(--u)); height: calc(30 * var(--u)); border: 1px solid var(--line2); border-radius: calc(8 * var(--u));
                    background: rgba(40, 42, 48, .7); color: #fff; opacity: .6; backdrop-filter: blur(2px); }
  .tail .maximize:hover { opacity: 1; }
  .tail .maximize svg { width: calc(15 * var(--u)); height: calc(15 * var(--u)); }
  .opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(calc(200 * var(--u)), 1fr)); gap: calc(8 * var(--u)); }
  .opt { display: flex; flex-direction: column; align-items: flex-start; gap: calc(2 * var(--u)); padding: calc(10 * var(--u)) calc(12 * var(--u)); border: 1px solid var(--line);
         border-radius: calc(10 * var(--u)); background: var(--card); cursor: pointer; text-align: left; }
  .opt.on { border-color: #a78bfa; background: #231f33; }
  .opt small { color: var(--muted); }
  .opt .box { color: #a78bfa; }
  .q { display: flex; flex-direction: column; gap: calc(8 * var(--u)); padding-bottom: calc(10 * var(--u)); }
  .q + .q { border-top: 1px solid var(--line2); padding-top: calc(12 * var(--u)); }
  .comment { padding: calc(9 * var(--u)) calc(12 * var(--u)); border-radius: calc(10 * var(--u)); background: var(--card); }
  .comment .who { font-size: calc(12 * var(--u)); color: var(--muted); }
  .comment .body { white-space: pre-wrap; overflow-wrap: anywhere; }
  .comment.claude { background: #1b1f27; }
  .desc { white-space: pre-wrap; overflow-wrap: anywhere; max-height: 30vh; overflow-y: auto; padding-bottom: calc(12 * var(--u)); margin-bottom: calc(12 * var(--u)); border-bottom: 1px solid var(--line2); }
  .form { display: grid; gap: calc(12 * var(--u)); }
  .form label { display: flex; flex-direction: column; gap: calc(5 * var(--u)); font-size: calc(12.5 * var(--u)); color: var(--muted); }
  .form .row2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(calc(200 * var(--u)), 1fr)); gap: calc(12 * var(--u)); }
  .check { display: flex; flex-direction: column; gap: calc(6 * var(--u)); padding: calc(10 * var(--u)) calc(12 * var(--u)); border: 1px solid var(--line); border-radius: calc(10 * var(--u)); }
  .check .pf { display: flex; gap: calc(6 * var(--u)); }
  .check .pf .on.pass { background: #14532d; border-color: #14532d; }
  .check .pf .on.fail { background: #7f1d1d; border-color: #7f1d1d; }
  .wiz { display: flex; flex-direction: column; gap: calc(12 * var(--u)); }
  .wiz .steps { display: flex; flex-wrap: wrap; gap: calc(6 * var(--u)); }
  .wiz .dot { width: calc(28 * var(--u)); height: calc(28 * var(--u)); border-radius: 50%; border: 1px solid var(--line); background: none; color: var(--muted); cursor: pointer; font-size: calc(12 * var(--u)); }
  .wiz .dot.at { border-color: var(--accent); color: var(--fg); background: var(--accent); }

  .wiz a.btn { text-decoration: none; color: inherit; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .wiz .results { margin: 0; padding-left: 0; list-style: none; display: flex; flex-direction: column; gap: calc(6 * var(--u)); }
  .wiz .results .results { margin-top: calc(6 * var(--u)); padding-left: calc(12 * var(--u)); }
  .wiz .res { display: inline-block; min-width: calc(40 * var(--u)); font-size: calc(12 * var(--u)); color: var(--muted); }
  .wiz .res.pass { color: #86efac; } .wiz .res.fail { color: #fca5a5; }
  #toast { position: fixed; left: 50%; bottom: calc(20 * var(--u)); transform: translateX(-50%); background: #2c2e33; color: #fff; padding: calc(10 * var(--u)) calc(16 * var(--u));
           border-radius: calc(10 * var(--u)); display: none; max-width: calc(100vw - calc(32 * var(--u))); z-index: 10; }
  #toast.err { background: #7f1d1d; }
  #reloadBar { display: flex; align-items: center; gap: calc(10 * var(--u)); margin: calc(10 * var(--u)) calc(20 * var(--u)) 0; padding: calc(8 * var(--u)) calc(12 * var(--u));

    #needs { margin: calc(10 * var(--u)) calc(12 * var(--u)) 0; } #needs .sum#needsSum { display: none; }
    .cols { grid-auto-columns: 86vw; }
    dialog { width: 100vw; max-width: 100vw; height: 100dvh; max-height: 100dvh; border-radius: 0; margin: 0; }
    .dlg { padding: calc(14 * var(--u)); }
  }
</style>
</head>
<body>
<header>
  <span class="title">cl board</span>
  <span id="summary" class="muted"></span>
  <span class="grow"></span>
  <div class="seg" role="group" aria-label="View">
    <button type="button" data-view="board">Board</button><button type="button" data-view="lanes">Lanes</button><button type="button" data-view="list">List</button>
  </div>
  <a class="btn" href="/">Terminal</a>
  <a class="btn" href="/?attach=operator" title="Talk to the operator: it can make tickets and check on sessions">Chat</a>
  <button type="button" class="btn" id="quickBtn" title="Tell the operator what to add; it makes the ticket">Quick ticket</button>
  <button type="button" class="btn primary" id="newBtn">New ticket</button>
</header>

<div id="reloadBar" role="status" hidden><span>cl was updated. It reloads by itself once you stop typing, or now:</span><button type="button" class="btn primary" id="reloadBtn">Reload</button></div>

<section id="needs" aria-label="Needs you">
  <div class="nhd"><button type="button" id="needsToggle" aria-expanded="true"><span>Needs you</span><span class="count" id="needsCount">0</span>
    <span class="sum" id="needsSum"></span><span style="flex:1"></span><span class="sum" id="needsHint">Collapse</span></button>
    <button type="button" id="needsHiddenBtn" aria-pressed="false" hidden></button></div>
  <div class="strip" id="needsStrip"></div>
</section>

<nav id="filters" aria-label="Filters">
  <select id="statusSel" aria-label="Status"></select>
  <select id="projectSel" aria-label="Project"></select>
  <label class="switch"><input type="checkbox" role="switch" id="subsSw"><span class="track"></span>Sub-tickets</label>
  <label class="switch"><input type="checkbox" role="switch" id="doneSw"><span class="track"></span>Done<span class="n" id="doneN"></span></label>
  <input id="search" type="search" placeholder="Search tickets" aria-label="Search tickets">
</nav>
<main id="main"></main>

<dialog id="ticketDlg" aria-label="Ticket"><div class="dlg" id="ticketBody"></div></dialog>
<dialog id="newDlg" aria-label="New ticket"><div class="dlg" id="newBody"></div></dialog>
<dialog id="finishDlg" aria-label="Finish the ticket" style="width:min(calc(480 * var(--u)), calc(100vw - calc(24 * var(--u))))"><div class="dlg" id="finishBody"></div></dialog>
<dialog id="subsDlg" aria-label="Unfinished sub-tickets" style="width:min(calc(520 * var(--u)), calc(100vw - calc(24 * var(--u))))"><div class="dlg" id="subsBody"></div></dialog>
<dialog id="quickDlg" aria-label="Quick ticket" style="width:min(calc(520 * var(--u)), calc(100vw - calc(24 * var(--u))))"><div class="dlg">
  <div class="head"><h1 style="flex:1">Quick ticket</h1><button type="button" class="btn" id="closeQuick">Cancel</button></div>
  <form class="form" id="quickForm">
    <label>What should be added<textarea name="text" rows="4" required placeholder="In your own words. The operator picks the project and the rest."></textarea></label>
    <p class="muted" style="margin:0">Enter sends it to the operator as &ldquo;Add a Ticket: &hellip;&rdquo;; Shift+Enter starts a new line.</p>
    <div class="actions"><button type="submit" class="btn primary" id="quickSend">Send to the operator</button></div></form></div></dialog>
<dialog id="killDlg" aria-label="Kill the session" style="width:min(calc(480 * var(--u)), calc(100vw - calc(24 * var(--u))))"><div class="dlg" id="killBody"></div></dialog>
<div id="toast" role="status"></div>

<script src="/xterm.js"></script>
<script src="/addon-fit.js"></script>
<script>
"use strict";
const STAGES = ["backlog", "planning", "queued", "running", "review", "testing", "done"];
const STAGE_NAME = { backlog: "Backlog", planning: "Planning", queued: "Queued", running: "Running", review: "Review", testing: "Testing", done: "Done" };
const FLAG_NAME = { input: "Needs input", question: "Question", review: "Ready for review", testing: "Needs testing", ended: "Session ended", "start-failed": "Didn't start", conflict: "Conflicts", "after-merge": "After-merge failed" };
const STATUS_NAME = { busy: "Working", waiting: "Waiting on you", blocked: "Waiting on you", idle: "Idle", shell: "Idle · background task", starting: "Starting", gone: "Session ended", killed: "Killed · restart it", unknown: "Unknown" };

const store = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch { return null; } };
const state = {
  data: null, view: store("cl-view") || "board", filter: "all", project: "", subs: store("cl-subs") === "1", done: store("cl-done") === "1",
  search: "", needsOpen: store("cl-needs") !== "0", needsHidden: store("cl-needs-hidden") === "1", open: null, detail: null, tab: null, picks: {}, other: {}, checks: {},
  sending: false,
};

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ago = (t) => { if (!t) return ""; const d = Math.max(0, (state.data?.now || Date.now() / 1000) - t);
  return d < 60 ? "now" : d < 3600 ? Math.floor(d / 60) + "m" : d < 86400 ? Math.floor(d / 3600) + "h" : Math.floor(d / 86400) + "d"; };
const toast = (msg, err) => { const el = document.getElementById("toast"); el.textContent = msg; el.className = err ? "err" : ""; el.style.display = "block";
  clearTimeout(toast.t); toast.t = setTimeout(() => (el.style.display = "none"), 3500); };

async function api(path, body) {
  const opts = body === undefined ? {} : { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) };
  const r = await fetch("/api/" + path, opts);
  if (r.status === 401) { location.href = "/"; throw new Error("log in"); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
async function act(key, action, body, msg) {
  try { const r = await api(`ticket/${encodeURIComponent(key)}/${action}`, body || {}); if (msg) toast(msg); await refresh(); return r; }
  catch (e) { toast(e.message, true); throw e; }
}
// The server answers once Claude has taken the answer (a few seconds at
// most), so the button says it's sending until then; after that the popup
// has done its job and closes.
async function sendAnswer(key, answers, btn) {
  if (state.sending) return;
  const was = btn.innerHTML; btn.disabled = true; btn.textContent = "Sending…"; state.sending = true;
  try { await act(key, "answer", { answers }, "Claude got your answer"); }
  catch { btn.disabled = false; btn.innerHTML = was; return; }
  finally { state.sending = false; }
  if (state.open === key) document.getElementById("ticketDlg").close();
}

const flagDetail = (f) => { try { return JSON.parse(f.detail); } catch { return null; } };
// The human is holding it up: it has a flag they haven't hidden, and Claude isn't working on it.
// A Done ticket only for a failed after-merge run (it comes after the merge).
const asksStill = (t, f) => t.stage !== "done" || f.kind === "after-merge";
const needsMe = (row) => row.ticket.flags.some((f) => !f.hidden && asksStill(row.ticket, f)) && !row.working;
// Hidden from Needs you: every flag it has is hidden (a new one brings it back).
const hiddenNeeds = (row) => row.ticket.flags.length > 0 && row.ticket.flags.every((f) => f.hidden) && row.ticket.flags.some((f) => asksStill(row.ticket, f)) && !row.working;
const asks = (t) => t.flags.filter((f) => f.kind !== "testing" || t.stage === "testing");
function askText(t, f) {
  const d = flagDetail(f);
  if (f.kind === "question") return d?.questions?.map((q) => q.question).join(" · ") || "Claude asked something";
  if (f.kind === "input") return d ? `${d.tool || "Permission"}: ${d.summary || "wants permission"}` : (f.detail || "Waiting on a prompt");
  if (f.kind === "review") return (d === null && f.detail === "plan") || f.detail === "plan" ? "The plan is ready for approval" : (t.summary || "Claude says it's done");
  if (f.kind === "testing") return "Ready to try";
  if (f.kind === "conflict") return "Merging it back conflicts in: " + f.detail.split("\n").map((l) => l.trim().split(/\s+/)[0]).join(", ");
  return f.detail || FLAG_NAME[f.kind] || f.kind;
}
// One short line for a Needs you card; askText goes in its tooltip. A lone question with quick
// answers keeps its text (clamped by CSS) so the buttons make sense.
function askLine(t, f, quick) {
  const d = flagDetail(f);
  if (f.kind === "question") return quick ? askText(t, f) : d?.questions?.length > 1 ? `Needs ${d.questions.length} answers` : "Needs an answer";
  if (f.kind === "input") return d?.tool ? `Wants permission: ${d.tool}` : "Waiting on a prompt";
  if (f.kind === "review") return f.detail === "plan" ? "Plan ready for approval" : "Ready for review";
  if (f.kind === "conflict") { const n = f.detail.split("\n").filter((l) => l.trim()).length; return `Merge conflicts in ${n} file${n === 1 ? "" : "s"}`; }
  if (f.kind === "after-merge") return "After-merge command failed: " + f.detail.split("\n")[0];
  return askText(t, f);
}
const flagLabel = (f) => f.kind === "review" && f.detail === "plan" ? "Plan ready" : (FLAG_NAME[f.kind] || f.kind);
const flagClass = (k) => k === "after-merge" ? "f-conflict" : ["input", "question", "review", "testing", "conflict"].includes(k) ? "f-" + k : "";
// Finishing: Claude is merging the branch or opening a PR before it goes to Done.
const finishPill = (t) => t.finishing ? `<span class="pill f-finishing" title="${t.finishing === "pr" ? "Claude is opening a PR" : t.finishing === "after-merge" ? "It's merged; Claude is doing the after-merge steps (rebuilding, restarting)" : t.finishing === "tell" ? "Claude is doing what you told it" : "Claude is merging its branch"}; it goes to Done after">Finishing</span>` : "";
// Claude asked to close it its own way (cl ticket custom-close).
const customPill = (t) => t.custom_close ? `<span class="pill f-review" title="Claude: ${esc(t.custom_close)}">Custom close</span>` : "";
const pills = (t) => t.flags.length || t.finishing || t.custom_close ? `<span class="pills">${customPill(t)}${finishPill(t)}${t.flags.map((f) => `<span class="pill ${flagClass(f.kind)}">${esc(flagLabel(f))}</span>`).join("")}</span>` : "";
// "(starting)" is the dispatcher's claim while it opens the session.
// A Backlog or Queued ticket whose session is gone hasn't ended: it's waiting to start.
// A killed one waits for you to restart it.
const statusOf = (row) => row.status || (row.ticket.tmux.startsWith("(") ? "starting" : row.ticket.killed ? "killed" : row.ticket.tmux && !["backlog", "queued"].includes(row.ticket.stage) ? "gone" : "none");
const statusHtml = (row) => { const s = statusOf(row); const label = s === "none" ? (row.ticket.stage === "queued" ? "Waiting for a slot" : "Not started") : (STATUS_NAME[s] || s);
  return `<span class="status s-${esc(s)}"><span class="dot"></span>${esc(label)}</span>`; };
// A live session's shell icon. In a card (a button) it's a span the click handler follows.
const SHELL_SVG = `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="11" rx="2"/><path d="M4.5 6l2 2-2 2M8.5 10.5h3"/></svg>`;
const liveRow = (row) => row.ticket.tmux && row.status && row.status !== "gone";
const shellIcon = (row, link) => !liveRow(row) ? "" : link
  ? `<a class="shell-ic" href="${shellHref(row.ticket)}" title="Open shell" aria-label="Open ${esc(row.ticket.key)}'s shell">${SHELL_SVG}</a>`
  : `<span class="shell-ic" data-shell="${shellHref(row.ticket)}" title="Open shell" aria-label="Open ${esc(row.ticket.key)}'s shell">${SHELL_SVG}</span>`;
const where = (t) => t.worktree || t.branch ? t.branch || "worktree" : t.mode === "worktree" ? "worktree on start" : t.target ? "queue: " + t.target : "queue";

// ---- board data ----
// Redraws from the 3-second refresh must not move anything: each scrolled
// element under root (found again by its child-index path) and the page keep
// their scroll, and a focused control keeps focus.
function pathTo(root, el) { const p = []; for (; el !== root; el = el.parentElement) p.unshift([...el.parentElement.children].indexOf(el)); return p; }
const atPath = (root, p) => p.reduce((el, i) => el?.children[i], root);
function keepScroll(root, draw) {
  const saved = [root, ...root.querySelectorAll("*")].filter((el) => el.scrollLeft || el.scrollTop)
    .map((el) => [pathTo(root, el), el.scrollLeft, el.scrollTop]);
  const page = [scrollX, scrollY]; const a = document.activeElement;
  const focus = a && a !== root && root.contains(a) ? pathTo(root, a) : null;
  draw();
  for (const [p, l, t] of saved) { const el = atPath(root, p); if (el) { el.scrollLeft = l; el.scrollTop = t; } }
  if (focus) atPath(root, focus)?.focus({ preventScroll: true });
  scrollTo(page[0], page[1]);
}
// Set el's HTML, leaving it alone when nothing changed.
function setHtml(el, html) {
  if (el.drawn === html) return;
  keepScroll(el, () => { el.innerHTML = html; });
  el.drawn = html;
}
async function refresh() {
  try { state.data = await api("board"); } catch (e) { if (e.message !== "log in") toast(e.message, true); return; }
  checkBuild(state.data.build);
  if (!drag) render();
  if (state.open) loadDetail(state.open, true);
}
// cl was rebuilt and restarted (an after-merge command, say): the page is
// from the old build. Reload, which keeps your place (see "where you were"),
// unless that would lose something being typed; then offer it until it won't.
function checkBuild(build) {
  if (!build) return;
  if (!state.build) { state.build = build; return; }
  if (build === state.build) return;
  document.getElementById("reloadBar").hidden = false;
  if (!typing()) location.reload();
}
function typing() {
  const el = document.activeElement;
  const editing = el && (el.isContentEditable || (["INPUT", "TEXTAREA", "SELECT"].includes(el.tagName) && !(el.closest(".xterm"))));
  return drag || editing || Date.now() - (state.typedAt || 0) < 30_000;
}
document.addEventListener("input", () => { state.typedAt = Date.now(); }, true);
function visible() {
  const q = state.search.toLowerCase();
  return state.data.tickets.filter((row) => {
    const t = row.ticket;
    if (!state.subs && t.parent) return false;
    if (!state.done && t.stage === "done") return false;
    if (state.project && t.project !== state.project) return false;
    if (q && !(t.key + " " + t.title + " " + t.body).toLowerCase().includes(q)) return false;
    const f = state.filter;
    if (f === "all") return true;
    if (f === "me") return needsMe(row);
    if (f === "working") return row.status === "busy";
    return t.flags.some((x) => x.kind === f);
  });
}

function render() {
  const d = state.data; if (!d) return;
  const live = d.tickets.filter((r) => r.status && r.status !== "gone").length;
  document.getElementById("summary").textContent = `${d.tickets.length} tickets · ${live} sessions live`;
  for (const b of document.querySelectorAll("[data-view]")) b.classList.toggle("on", b.dataset.view === state.view);
  renderNeeds(); renderFilters();
  const main = document.getElementById("main");
  if (!d.projects.length) {
    setHtml(main, `<p class="empty">No projects yet. Add one with <span class="mono">cl project add &lt;name&gt; &lt;dir&gt;</span>, or with New ticket.</p>`); return;
  }
  const rows = visible();
  setHtml(main, state.view === "lanes" ? lanesHtml(rows) : state.view === "list" ? listHtml(rows) : boardHtml(rows));
}

function renderNeeds() {
  const rows = state.data.tickets.filter(needsMe);
  const hidden = state.data.tickets.filter(hiddenNeeds);
  rows.sort((a, b) => Math.min(...a.ticket.flags.map((f) => f.at)) - Math.min(...b.ticket.flags.map((f) => f.at)));
  const box = document.getElementById("needs");
  box.style.display = rows.length || hidden.length ? "" : "none";
  const hb = document.getElementById("needsHiddenBtn");
  hb.hidden = !hidden.length; hb.textContent = state.needsHidden ? `Hide ${hidden.length} hidden` : `${hidden.length} hidden`;
  hb.setAttribute("aria-pressed", state.needsHidden);
  hb.title = state.needsHidden ? "Stop showing the items you hid" : "Show the items you hid";
  const shown = state.needsHidden ? [...rows, ...hidden] : rows;
  box.classList.toggle("closed", !state.needsOpen);
  document.getElementById("needsToggle").setAttribute("aria-expanded", state.needsOpen);
  document.getElementById("needsHint").textContent = state.needsOpen ? "Collapse" : "Expand";
  document.getElementById("needsCount").textContent = rows.length;
  const counts = {}; for (const r of rows) for (const f of r.ticket.flags) counts[f.kind] = (counts[f.kind] || 0) + 1;
  document.getElementById("needsSum").textContent = Object.entries(counts).map(([k, n]) => `${n} ${(FLAG_NAME[k] || k).toLowerCase()}`).join(" · ");
  setHtml(document.getElementById("needsStrip"), shown.map((r) => {
    const t = r.ticket; const isHidden = hiddenNeeds(r); const f = isHidden ? t.flags[0] : t.flags.find((x) => !x.hidden && asksStill(t, x)); const d = flagDetail(f);
    let quick = "";
    if (f.kind === "question" && d?.questions?.length === 1 && !d.questions[0].multiSelect)
      quick = (d.questions[0].options || []).slice(0, 3).map((o, i) => `<button type="button" class="btn" data-answer="${esc(t.key)}" data-n="${i + 1}">${esc(o.label)}</button>`).join("");
    if (f.kind === "input" && d?.options?.length)
      quick = d.options.slice(0, 2).map((o) => `<button type="button" class="btn" data-answer="${esc(t.key)}" data-n="${o.n}">${esc(o.label)}</button>`).join("");
    const main = f.kind === "review" && f.detail === "plan" ? `<button type="button" class="btn primary" data-approve="${esc(t.key)}">Approve plan</button>`
      : f.kind === "review" ? `<button type="button" class="btn primary" data-open="${esc(t.key)}" data-tab="review">Review</button>`
      : f.kind === "testing" ? `<button type="button" class="btn primary" data-open="${esc(t.key)}" data-tab="test">Test it</button>`
      : f.kind === "after-merge" ? `<button type="button" class="btn primary" data-open="${esc(t.key)}" data-tab="after-merge">See the log</button>`
      : `<button type="button" class="btn primary" data-open="${esc(t.key)}" data-tab="needs">Open</button>`;
    const shell = t.tmux && r.status && r.status !== "gone" ? `<a class="btn" href="${shellHref(t)}">Shell</a>` : "";
    // Hiding keeps the flags (the card still shows them); a new flag brings it back.
    const hide = isHidden ? `<button type="button" class="btn" data-unhide="${esc(t.key)}" title="Put it back in Needs you">Unhide</button>`
      : `<button type="button" class="btn" data-hide="${esc(t.key)}" title="Take it out of Needs you until it raises a new flag; its card keeps the flag">Hide</button>`;
    return `<div class="ask${isHidden ? " hidden" : ""}"><div class="pills"><span class="pill ${flagClass(f.kind)}">${esc(flagLabel(f))}</span>${isHidden ? `<span class="pill">Hidden</span>` : ""}<span class="mono muted" style="font-size:calc(11.5 * var(--u))">${esc(t.key)} · ${ago(f.at)}</span></div>
      <div style="font-weight:500">${esc(t.title)}</div><div class="what" title="${esc(askText(t, f))}">${esc(askLine(t, f, quick))}</div>
      ${quick ? `<div class="acts">${quick}</div>` : ""}<div class="acts">${main}${shell}${hide}</div></div>`;
  }).join(""));
}

function renderFilters() {
  const d = state.data; const mine = d.tickets.filter((r) => state.subs || !r.ticket.parent);
  const done = mine.filter((r) => r.ticket.stage === "done").length; const all = state.done ? mine : mine.filter((r) => r.ticket.stage !== "done");
  const n = (f) => all.filter((r) => f === "all" || (f === "me" ? needsMe(r) : f === "working" ? r.status === "busy" : r.ticket.flags.some((x) => x.kind === f))).length;
  const statuses = [["all", "All tickets"], ["me", "Needs me"], ["input", "Needs input"], ["question", "Questions"], ["review", "Review"], ["testing", "Testing"], ["working", "Working"]];
  setHtml(document.getElementById("statusSel"), statuses.map(([k, l]) =>
    `<option value="${k}" ${state.filter === k ? "selected" : ""}>${l} (${n(k)})</option>`).join(""));
  setHtml(document.getElementById("projectSel"), `<option value="">All projects</option>`
    + d.projects.map((p) => `<option ${p.name === state.project ? "selected" : ""}>${esc(p.name)}</option>`).join(""));
  document.getElementById("statusSel").value = state.filter;
  document.getElementById("projectSel").value = state.project;
  document.getElementById("subsSw").checked = state.subs;
  document.getElementById("doneSw").checked = state.done;
  document.getElementById("doneN").textContent = !state.done && done ? `${done} hidden` : "";
}

function cardHtml(row, compact) {
  const t = row.ticket; const hot = t.flags.some((f) => f.kind === "input" || f.kind === "question");
  return `<button type="button" class="card s-${esc(statusOf(row))} ${hot ? "hot" : ""}" data-open="${esc(t.key)}" data-drag="${esc(t.key)}">
    <span class="hd"><span class="top"><span>${esc(t.key)}</span><span class="grow"></span>${shellIcon(row)}<span>${ago(t.updated)}</span></span>
    <span class="t">${esc(t.title)}</span></span>
    ${t.parent ? `<span class="sub">sub-ticket of ${esc(t.parent)}</span>` : ""}
    ${compact ? "" : `<span class="meta">${esc(t.project)} · ${esc(where(t))}</span>`}
    ${t.children ? `<span class="meta">${t.children} sub-ticket${t.children > 1 ? "s" : ""}</span>` : ""}
    ${statusHtml(row)}${pills(t)}</button>`;
}
// Done is a column only when it's toggled on.
const columns = () => state.done ? STAGES : STAGES.filter((s) => s !== "done");
// A column top to bottom: by priority (drag to reorder), except Done, latest first.
const inColumn = (rows, stage) => { const cs = rows.filter((r) => r.ticket.stage === stage);
  return stage === "done" ? cs : cs.sort((a, b) => a.ticket.rank - b.ticket.rank || a.ticket.id - b.ticket.id); };
function boardHtml(rows) {
  return `<div class="cols">${columns().map((s) => { const cs = inColumn(rows, s);
    return `<section class="col" data-drop="${s}"><h2>${STAGE_NAME[s]}<span class="n">${cs.length}</span></h2>${cs.map((r) => cardHtml(r)).join("")}<button type="button" class="add" data-new-when="${s}" aria-label="New ticket in ${STAGE_NAME[s]}">+</button></section>`; }).join("")}</div>`;
}
function lanesHtml(rows) {
  const projects = state.data.projects.filter((p) => !state.project || p.name === state.project);
  return `<div class="lanes"><table><thead><tr><th></th>${columns().map((s) => `<th>${STAGE_NAME[s]}</th>`).join("")}</tr></thead><tbody>
    ${projects.map((p) => { const mine = rows.filter((r) => r.ticket.project === p.name);

// ---- drag a card to another column, or up and down for priority ----

let drag = null, dragDone = 0;
function dropAt(x, y) {

}

  if (s && el === drag.home && s.i === drag.at) s = null; // where it already is
  if (s?.above !== drag.slot?.above || s?.below !== drag.slot?.below) { showSlot(drag.slot, false); showSlot(s, true); }

// Where in a column a drop at height y lands: between the cards above and

// Done has no order of its own.
function slotAt(el, y) {

  const cards = [...el.querySelectorAll("[data-drag]")].filter((c) => c !== drag.el);
  let i = cards.findIndex((c) => { const r = c.getBoundingClientRect(); return y < r.top + r.height / 2; });
  if (i < 0) i = cards.length;

function showSlot(s, on) {

}

  const s = d.slot;
  const place = s?.above ? { after: s.above.dataset.drag } : s?.below ? { before: s.below.dataset.drag } : {};

// Then, for a ticket with a branch of its own, what finishing means: Claude

// Says what goes: the session (shared, for a queue ticket, with any other

function confirmKill(d) {

    ${t.mode === "queue" ? `<p style="margin:0">It's a queue ticket, so this is the project's shared session${others.length ? `: ${others.map(esc).join(", ")} ${others.length > 1 ? "are" : "is"} on it too and will need restarting as well` : ""}.

  // Merge or PR: it stays put (Finishing) until Claude is done.

document.addEventListener("pointerup", (e) => { if (drag && e.pointerId === drag.id) endDrag(true); });
document.addEventListener("pointercancel", (e) => { if (drag && e.pointerId === drag.id) endDrag(false); });
// Once a finger has picked a card up, keep the page from scrolling under it.
document.addEventListener("touchmove", (e) => { if (drag?.ghost) e.preventDefault(); }, { passive: false });
document.addEventListener("contextmenu", (e) => { if (drag) e.preventDefault(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && drag) endDrag(false); });
// A drop ends with a click on the card; don't let it open the ticket.
document.addEventListener("click", (e) => { if (Date.now() - dragDone < 400 && e.target.closest("[data-drag]")) { e.stopPropagation(); e.preventDefault(); } }, true);

// ---- events ----
document.addEventListener("click", async (e) => {
  const sh = e.target.closest("[data-shell]");
  if (sh) { e.preventDefault(); if (e.ctrlKey || e.metaKey) window.open(sh.dataset.shell); else location.href = sh.dataset.shell; return; }
  const el = e.target.closest("button, a, tr.row"); if (!el) return;
  const ds = el.dataset;
  if (ds.view) { state.view = ds.view; store("cl-view", ds.view); render(); return; }
  if (el.id === "needsToggle") { state.needsOpen = !state.needsOpen; store("cl-needs", state.needsOpen ? "1" : "0"); renderNeeds(); return; }
  if (el.id === "newBtn") return openNew(null);
  if (ds.newWhen || ds.newProject) return openNew(null, { when: ds.newWhen, project: ds.newProject });
  if (el.id === "closeNew") return document.getElementById("newDlg").close();
  if (el.id === "quickBtn") return openQuick();
  if (el.id === "reloadBtn") return location.reload();
  if (el.id === "closeQuick") return document.getElementById("quickDlg").close();
  if (el.id === "closeDlg") { document.getElementById("ticketDlg").close(); return; }
  if (ds.finish === "tell") return finishTell();
  if (ds.finish !== undefined) { document.getElementById("finishDlg").close(ds.finish); return; }
  if (el.id === "spinOff" || el.id === "spinCancel") { document.getElementById("subsDlg").close(el.id === "spinOff" ? "spin" : ""); return; }
  if (ds.kill !== undefined) { document.getElementById("killDlg").close(ds.kill); return; }
  if (el.id === "needsHiddenBtn") { state.needsHidden = !state.needsHidden; store("cl-needs-hidden", state.needsHidden ? "1" : "0"); renderNeeds(); return; }
  if (ds.hide) return act(ds.hide, "hide", {}, `${ds.hide} hidden from Needs you; a new flag brings it back`);
  if (ds.unhide) return act(ds.unhide, "unhide", {}, `${ds.unhide} is back in Needs you`);
  if (ds.answer) { e.stopPropagation(); return sendAnswer(ds.answer, [ds.n], el); }
  if (ds.approve) {
    const extra = state.data.tickets.find((r) => r.ticket.key === ds.approve)?.ticket.stage === "testing" ? await doneExtras(ds.approve) : {};
    if (!extra) return;
    return act(ds.approve, "approve", extra, finishMsg(ds.approve, extra) || "Approved");
  }
  if (ds.open) return openTicket(ds.open, ds.tab);
  const key = state.open; if (!key) return;
  if (ds.tab) { state.tab = ds.tab; state.tailPinned = true; tail.text = null; renderDetail(); return; }
  if (el.id === "toBottom") { tail.term?.scrollToBottom(); setPinned(true); return; }
  if (ds.move) return act(key, "move", { stage: ds.move }, "Moved");
  if (ds.relocate) {
    let r; try { r = await act(key, "relocate", { mode: ds.relocate }); } catch { return; }
    toast(r.result === "waiting" ? (ds.relocate === "worktree" ? "All worktree slots are taken: it waits in Queued for one" : "Back in the queue: it waits for the project's session")
      : r.result === "moved" ? (ds.relocate === "worktree" ? "Moved to its own worktree" : "Moved to the main folder")
      : ds.relocate === "worktree" ? "It gets a worktree of its own when it starts" : "It runs in the queue when it starts");
    return;
  }
  if (ds.pick !== undefined && ds.multi) {
    const p = state.picks[ds.pick] || []; state.picks[ds.pick] = p.includes(ds.n) ? p.filter((x) => x !== ds.n) : [...p, ds.n]; renderDetail(); return;
  }
  if (ds.pick !== undefined) { state.picks[ds.pick] = ds.n; state.other[ds.pick] = ""; renderDetail(); return; }
  if (ds.perm) return sendAnswer(key, [ds.perm], el);
  if (ds.afterMerge) {
    try { await api(`project/${encodeURIComponent(ds.afterMerge)}/after-merge`, { key }); toast("Running it again; the result comes back here"); } catch (e) { toast(e.message, true); }
    return;
  }
  if (ds.unflag) return act(key, "unflag", { kind: ds.unflag }, "Dismissed");
  if (ds.check !== undefined) { const c = state.checks["c" + ds.check] || {}; c.pass = ds.pass === "1"; state.checks["c" + ds.check] = c; saveProgress(); renderDetail(); return; }
  if (ds.stepGo !== undefined) { state.checks.step = Math.max(0, +ds.stepGo); saveProgress(); renderDetail(); document.getElementById("ticketDlg").scrollTop = 0; return; }
  if (ds.launch) return act(key, "launch", { step: +ds.launch }, "Started");
  if (ds.launchStop) return act(key, "launch-stop", { step: +ds.launchStop }, "Stopped");
  if (ds.act === "gutter") {
    try { const r = await act(key, "gutter"); toast("gutter's window is open"); } catch {}
    return;
  }
  if (ds.act === "start") return act(key, "start", {}, state.detail?.ticket.killed || state.detail?.ticket.session_id ? "Restarted" : "Started");
  if (ds.act === "kill") {
    const d = state.detail; if (!d || !await confirmKill(d)) return;
    try { await act(key, "kill", {}, `Killed ${d.ticket.tmux}; Restart brings it back`); } catch {}
    return;
  }
  if (ds.act === "approve" && state.detail?.ticket.stage === "testing") {
    const extra = await doneExtras(key); if (!extra) return;
    return act(key, "approve", extra, finishMsg(key, extra) || "Done");
  }
  if (ds.act) return act(key, ds.act, {}, "Done");
  if (el.id === "sendAnswers") {
    const qs = flagDetail(state.detail.ticket.flags.find((f) => f.kind === "question"))?.questions || [];
    // A multi-select answer is its picks, then ";" and your own words (see `cl ticket answer`).
    const answers = qs.map((q, i) => { const own = (state.other[i] || "").trim();
      if (!q.multiSelect) return own || state.picks[i];
      const picks = [...(state.picks[i] || [])].sort((a, b) => a - b).join(",");
      return own ? `${picks};${own}` : picks; });
    if (answers.some((x) => !x)) return toast("Answer every question first", true);
    return sendAnswer(key, answers, el);
  }
  if (el.id === "sendMsg" || el.id === "saveNote" || el.id === "saveSend" || el.id === "sendBack") {
    const box = document.getElementById(el.id === "sendMsg" ? "msg" : el.id === "sendBack" ? "backText" : "commentText");
    const text = box.value.trim(); if (!text) return;
    const r = await act(key, "comment", { text, send: el.id !== "saveNote" });
    box.value = ""; toast(r.sent_back ? `Back to Claude: round ${r.round}` : r.sent ? "Sent" : r.unsent ? "Saved (no session yet)" : "Saved");
    return;
  }
  if (el.id === "sendResults" || el.id === "sendResults2") {
    const send = el.dataset.send === "1";
    const checks = planChecks(state.detail.test_plan).map((c, i) => ({ text: c.text, si: c.si, pass: state.checks["c" + i]?.pass, note: state.checks["c" + i]?.note || "" }));
    const miss = checks.findIndex((c) => c.pass === undefined);
    if (miss >= 0) { state.checks.step = planChecks(state.detail.test_plan)[miss].si; renderDetail(); return toast("Pass or fail every check first", true); }
    const extra = !send && checks.every((c) => c.pass) && state.detail.ticket.stage === "testing" ? await doneExtras(key) : {};
    if (!extra) return;
    const steps = state.detail.test_plan.steps.map((st, si) => ({ title: st.title, comment: state.checks["s" + si] || "",
      checks: checks.filter((c) => c.si === si).map(({ text, pass, note }) => ({ text, pass, note })) }));
    clearTimeout(progressTimer);
    const r = await act(key, "test-results", { steps, send, note: document.getElementById("testNote").value, ...extra });
    toast(r.sent ? "Sent to Claude" : r.unsent ? "No session to send to: kept as a comment" : !r.approved ? "All passed: kept on the ticket"
      : finishMsg(key, extra) ? "All passed: " + finishMsg(key, extra) : "All passed: done", r.unsent); state.checks = {};
    return;
  }
  if (el.id === "deleteTicket") {
    if (el.dataset.sure !== "1") { el.dataset.sure = "1"; el.textContent = "Really delete?"; return; }
    await act(key, "rm", {}, "Deleted"); document.getElementById("ticketDlg").close(); return;
  }
});
document.addEventListener("input", (e) => {
  const ds = e.target.dataset;
  if (ds.other !== undefined) { state.other[ds.other] = e.target.value; }
  if (ds.note !== undefined) { const c = state.checks["c" + ds.note] || {}; c.note = e.target.value; state.checks["c" + ds.note] = c; saveProgress(); }
  if (ds.comment !== undefined) { state.checks["s" + ds.comment] = e.target.value; saveProgress(); }
  if (e.target.id === "testNote") { state.checks.note = e.target.value; saveProgress();
    const row = document.getElementById("submitRow"); if (row) row.innerHTML = submitButtons(state.detail, planChecks(state.detail.test_plan)); }
  if (e.target.id === "search") { state.search = e.target.value; render(); }
});
document.addEventListener("change", (e) => {
  if (e.target.id === "statusSel") { state.filter = e.target.value; render(); }
  if (e.target.id === "projectSel") { state.project = e.target.value; render(); }
  if (e.target.id === "doneSw") { state.done = e.target.checked; store("cl-done", state.done ? "1" : "0"); render(); }
  if (e.target.id === "subsSw") { state.subs = e.target.checked; store("cl-subs", state.subs ? "1" : "0"); render(); }
  if (e.target.id === "stageSel" && state.open) moveTo(state.open, e.target.value);
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && e.target.id === "msg") { e.preventDefault(); document.getElementById("sendMsg").click(); }
});
// Ctrl+= / Ctrl+- / Ctrl+0 zoom the board, as browser zoom would (and in
// place of it), in the browser's own steps. Remembered per browser; 0 goes
// back to web.font_size.
const ZOOMS = [0.5, 0.67, 0.75, 0.8, 0.9, 1, 1.1, 1.25, 1.5, 1.75, 2, 2.5, 3];
document.addEventListener("keydown", (e) => {
  if (!(e.ctrlKey || e.metaKey) || e.altKey) return;
  const dir = e.key === "=" || e.key === "+" ? 1 : e.key === "-" ? -1 : e.key === "0" ? 0 : null;
  if (dir === null) return;
  e.preventDefault();
  const now = Number(store("cl-board-zoom")) || 1;
  let i = ZOOMS.findIndex((z) => z >= now - 0.001);
  if (i < 0) i = ZOOMS.length - 1;
  const next = dir === 0 ? 1 : ZOOMS[Math.max(0, Math.min(ZOOMS.length - 1, ZOOMS[i] > now + 0.001 && dir > 0 ? i : i + dir))];
  store("cl-board-zoom", String(next));
  document.documentElement.style.setProperty("--zoom", next);
  toast(`Board size ${Math.round(next * 100)}%`);
});
document.addEventListener("submit", async (e) => {
  e.preventDefault();
  if (e.target.id === "newForm") return submitNew(e.target);
  if (e.target.id === "quickForm") return submitQuick(e.target);
  if (e.target.id === "editForm") {
    const f = Object.fromEntries(new FormData(e.target));
    await act(state.open, "edit", { title: f.title, body: f.body, project: f.project, mode: f.mode, target: f.target, plan: f.plan === "1", skill: f.skill }, "Saved");
    if (e.submitter?.value === "close") document.getElementById("ticketDlg").close();
  }
});
document.getElementById("ticketDlg").addEventListener("close", () => { state.open = null; state.detail = null; });

// ---- where you were ----
// Leaving the board (Shell, Chat, Terminal, a reload) saves this tab's place:
// filters, search, the open ticket and its tab, what's half typed in it, and
// every scroll. Coming back puts it all back. Per tab, in sessionStorage.
const DRAFTS = ["commentText", "msg", "backText", "testNote"];
function scrolls() {
  return [...document.body.querySelectorAll("*")].filter((el) => el.scrollLeft || el.scrollTop)
    .map((el) => [pathTo(document.body, el), el.scrollLeft, el.scrollTop]);
}
function restoreScrolls(saved) {
  for (const [p, l, t] of saved) { const el = atPath(document.body, p); if (el) { el.scrollLeft = l; el.scrollTop = t; } }
}
addEventListener("pagehide", () => {
  const drafts = {}; for (const id of DRAFTS) { const el = document.getElementById(id); if (el?.value) drafts[id] = el.value; }
  const place = { filter: state.filter, project: state.project, search: state.search, open: state.open, tab: state.tab,
    picks: state.picks, other: state.other, tailPinned: state.tailPinned, drafts, scrolls: scrolls(), page: [scrollX, scrollY] };
  try { sessionStorage.setItem("cl-board-place", JSON.stringify(place)); } catch {}
});
async function restorePlace() {
  let place = null;
  try { place = JSON.parse(sessionStorage.getItem("cl-board-place") || "null"); } catch {}
  if (!place) return refresh();
  Object.assign(state, { filter: place.filter || "all", project: place.project || "", search: place.search || "" });
  document.getElementById("search").value = state.search;
  await refresh();
  restoreScrolls(place.scrolls || []);
  scrollTo(...(place.page || [0, 0]));
  if (!place.open || !state.data) return;
  const opening = openTicket(place.open, place.tab);
  Object.assign(state, { picks: place.picks || {}, other: place.other || {} });
  await opening;
  if (state.open !== place.open) return;
  // Gone since (deleted, say): don't leave an empty popup up.
  if (!state.detail) { document.getElementById("ticketDlg").close(); return; }
  for (const [id, v] of Object.entries(place.drafts || {})) { const el = document.getElementById(id); if (el) el.value = v; }
  restoreScrolls(place.scrolls || []);
  scrollTo(...(place.page || [0, 0]));
  // Back at the bottom if it was following; where it was if scrolled up.
  if (place.tailPinned !== false) { tail.term?.scrollToBottom(); setPinned(true); }
}

restorePlace();
setInterval(() => { if (!document.hidden) refresh(); }, 3000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
</script>
